http:
  method: GET
  url: "{{baseUrl}}/actuator/health/:*path"
  headers:
    - name: Accept
      value: application/vnd.spring-boot.actuator.v3+json
  params:
    - name: "*path"
      value: <string>
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

