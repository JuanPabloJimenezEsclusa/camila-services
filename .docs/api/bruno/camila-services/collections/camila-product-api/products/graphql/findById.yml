info:
  name: findById
  type: graphql
  seq: 1

graphql:
  method: POST
  url: "{{baseUrl}}/graphql"
  headers:
    - name: Accept
      value: application/json
  body:
    query: |
      query findById($internalId: ID) {
        findById(internalId: $internalId) {
          id, internalId, category, name, salesUnits, stock
        }
      }
    variables: |-
      {
         "internalId": "10"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
