name: camila-product-api-env-int-kind
variables:
  - name: baseUrl
    value: http://localhost:{{basePort}}/{{basePath}}
  - name: basePort
    value: "8080"
  - name: basePath
    value: product-int/api
  - name: websocket.baseUrl
    value: ws://localhost
  - name: websocket.basePort
    value: "8080"
  - name: websocket.basePath
    value: product-int/api/ws/products
  - name: grpc.baseUrl
    value: localhost
  - name: grpc.basePort
    value: "6565"
