name: Build Deploy Gradle

on:
  push:
    branches: [main]
  pull_request:
    branches: [ feature/**, hotfix/**, bugfix/** ]
    types: [ opened, synchronize, reopened, ready_for_review ]

concurrency:
  group: build-deploy-gradle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-quality:
    if: github.event.pull_request.draft == false
    name: Build & Quality Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      checks: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'semeru'

      - name: Setup Gradle
        # git ls-remote --tags https://github.com/gradle/actions.git
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          gradle-version: '9.2.1'

      - name: Run unit tests
        run: gradle unitTest --no-daemon -x test
        continue-on-error: true

      - name: Run Error Prone checks
        run: gradle build -PerrorProne --no-daemon
        continue-on-error: true

      - name: Run SpotBugs analysis
        run: gradle spotbugsReport --no-daemon
        continue-on-error: true

      - name: Aggregate JaCoCo coverage
        run: gradle aggregateJacoco --no-daemon
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-test-results
          path: |
            **/build/test-results/
            **/build/reports/tests/

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-coverage-reports
          path: |
            **/build/reports/jacoco/
            camila-coverage-jacoco/build/reports/jacoco/

      - name: Upload SpotBugs reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-spotbugs-reports
          path: |
            **/build/reports/spotbugs/

  build-artifact:
    if: github.event.pull_request.draft == false
    name: Build & Package Artifact
    runs-on: ubuntu-latest
    needs: build-quality
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'semeru'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          gradle-version: '9.2.1'

      - name: Build application
        run: gradle build --no-daemon -x test

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: gradle-build-artifacts
          path: |
            **/build/libs/
            **/build/*.jar

  deploy:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    name: Deploy to GitHub Packages
    runs-on: ubuntu-latest
    needs: [build-quality, build-artifact]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'semeru'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          gradle-version: '9.2.1'

      - name: Publish to GitHub Packages
        run: gradle publish --no-daemon
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Build Docker images
        run: gradle bootBuildImage --no-daemon
        continue-on-error: true
