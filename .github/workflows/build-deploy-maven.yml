name: Build Deploy Maven

on:
  pull_request:
    branches: [ develop ]
    types: [ opened, synchronize, reopened, ready_for_review ]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    uses: ./.github/workflows/detect-java-changes.yml

  publish:
    needs: changes
    if: github.event.pull_request.draft == false && needs.changes.outputs.skip != 'true'
    name: Build and Deploy Maven Artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'semeru'
          cache: 'maven'
      - name: Cache local Maven repository
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Build with Maven
        run: mvn --no-transfer-progress -B package -Dmaven.test.skip=true -Dgpg.skip --file pom.xml
      - name: Deploy with Maven if not exists
        if: ${{ github.event_name != 'pull_request' }}
        run: mvn --no-transfer-progress -B deploy -Dmaven.test.skip=true -Dgpg.skip --file pom.xml || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
