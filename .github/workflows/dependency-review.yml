name: Dependency Review

on:
  push:
    branches: [develop]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: dependencies-review-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.event.before }}
  HEAD_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.sha }}

jobs:
  dependency-review:
    if: github.event.pull_request.draft == false
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          base-ref: ${{ env.BASE_REF }}
          head-ref: ${{ env.HEAD_REF }}
          external-repo-token: ${{ secrets.GITHUB_TOKEN }}
          fail-on-severity: moderate
          comment-summary-in-pr: always
          vulnerability-check: true
          license-check: false
