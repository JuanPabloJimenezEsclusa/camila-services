name: Pre-commit

on:
  pull_request:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pre-commit:
    name: Run pre-commit hooks
    # Dependabot cannot repair what the fixer hooks rewrite, so running here would
    # only block its automerge queue; a resync is pushed on top when a bump needs it.
    # A skipped job does not block merges.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions: { contents: read }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with: { python-version: '3.13' }

      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run hooks
        run: |
          python -m pip install --quiet --require-hashes --only-binary :all: -r .github/pre-commit-requirements.txt
          pre-commit run --all-files --show-diff-on-failure
