name: SonarQube

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: sonarqube
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

env:
  MAVEN_OPTS: "-Xmx2048m"
  MAVEN_CLI_OPTS: "--no-transfer-progress -B -ntp -e"

jobs:
  build:
    if: github.event.pull_request.draft == false
    name: SonarQube Code Analysis
    environment: pro
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Configure GPG Key
        run: |
          echo -n "${MAVEN_GPG_KEY}" | base64 --decode | gpg --batch --passphrase ${MAVEN_GPG_PASSPHRASE} --import
        env:
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      - name: Checkout repository
        uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'corretto'
          cache: maven
      - name: Cache SonarQube packages
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Enable Testcontainers reuse
        run: |
          echo "testcontainers.reuse.enable=true" > ~/.testcontainers.properties
      - name: Build and analyze
        id: sonarqube-analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          mvn ${{ env.MAVEN_CLI_OPTS }} verify sonar:sonar -f pom.xml
      - name: Upload SonarQube Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sonarqube-reports
          path: |
            **/target/sonar/
            target/.sonar/
          retention-days: 30
          if-no-files-found: warn
      - name: Generate SonarQube Analysis Summary
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_PROJECT_KEY: JuanPabloJimenezEsclusa_camila-services
          SONAR_BRANCH: develop
          SONAR_ANALYSIS_OUTCOME: ${{ steps.sonarqube-analysis.outcome }}
        run: |
          python3 .github/scripts/sonar_summary.py | tee sonar-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment PR with SonarQube Results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const summaryPath = 'sonar-summary.md';
            
            let comment = fs.existsSync(summaryPath)
              ? fs.readFileSync(summaryPath, 'utf8')
              : '## 📊 SonarQube Code Analysis\n\n⚠️ **No SonarQube results were collected.**\n';
            
            comment += '\n---\n';
            comment += '<sub>💡 Metrics are read from SonarCloud for the `develop` branch. Full reports are in the `sonarqube-reports` artifact.</sub>\n';
            
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
      - name: Check SonarQube Analysis Status
        if: failure() && steps.sonarqube-analysis.conclusion == 'failure'
        run: |
          echo "❌ SonarQube analysis failed!"
          echo "Please review the build output and SonarQube reports."
          exit 1
