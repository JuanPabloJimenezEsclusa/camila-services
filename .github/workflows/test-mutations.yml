name: Mutation Tests

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MAVEN_OPTS: "-Xmx2048m"
  MAVEN_CLI_OPTS: "--no-transfer-progress -B -ntp -e"

jobs:
  changes:
    uses: ./.github/workflows/detect-java-changes.yml
  test:
    needs: changes
    if: github.event.pull_request.draft == false && needs.changes.outputs.skip != 'true'
    permissions:
      contents: read
      pull-requests: write
    name: Mutation Testing Analysis
    environment: pro
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Configure GPG Key
        run: |
          echo -n "${MAVEN_GPG_KEY}" | base64 --decode | gpg --batch --passphrase ${MAVEN_GPG_PASSPHRASE} --import
        env:
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      - name: Checkout repository
        uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: 'maven'
      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Enable Testcontainers reuse
        run: |
          echo "testcontainers.reuse.enable=true" > ~/.testcontainers.properties
      - name: Run Mutation Tests
        id: mutation-tests
        run: |
          mvn ${{ env.MAVEN_CLI_OPTS }} test pitest:report-aggregate-module -P pitest
      - name: Upload PIT Mutation Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pitest-reports
          path: |
            **/target/pit-reports/
          retention-days: 7
          if-no-files-found: warn
      - name: Generate Mutation Test Summary
        if: always()
        run: |
          python3 .github/scripts/mutation_summary.py | tee mutation-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment PR with Mutation Test Results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const summaryPath = 'mutation-summary.md';
            
            let comment = fs.existsSync(summaryPath)
              ? fs.readFileSync(summaryPath, 'utf8')
              : '## 🧬 Mutation Testing Report\n\n⚠️ **No mutation reports were generated.**\n';
            
            comment += '\n---\n';
            comment += '<sub>📦 Full PIT reports (XML/HTML) are available in the `pitest-reports` artifact.</sub>\n';
            
            comment += '\n<!-- mutation-summary -->\n';
            const { owner, repo } = context.repo;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: context.issue.number, per_page: 100
            });
            const previous = comments.find(c =>
              c.body.includes('<!-- mutation-summary -->') && c.user.login === 'github-actions[bot]');
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body: comment });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: context.issue.number, body: comment });
            }
      - name: Check Mutation Tests Status
        if: failure() && steps.mutation-tests.conclusion == 'failure'
        run: |
          echo "❌ Mutation tests failed!"
          echo "Please review the test output and mutation report artifacts."
          exit 1
