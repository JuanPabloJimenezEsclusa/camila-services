name: Mutation Tests

on:
  push:
    branches: [develop]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: mutation-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  MAVEN_OPTS: "-Xmx2048m"
  MAVEN_CLI_OPTS: "--no-transfer-progress -B -ntp -e"

jobs:
  test:
    if: github.event.pull_request.draft == false
    name: Mutation Testing Analysis
    environment: pro
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Configure GPG Key
        run: |
          echo -n "${MAVEN_GPG_KEY}" | base64 --decode | gpg --batch --passphrase ${MAVEN_GPG_PASSPHRASE} --import
        env:
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: 'maven'

      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Enable Testcontainers reuse
        run: |
          echo "testcontainers.reuse.enable=true" > ~/.testcontainers.properties

      - name: Run Mutation Tests
        id: mutation-tests
        run: |
          mvn ${{ env.MAVEN_CLI_OPTS }} test pitest:report-aggregate-module -P pitest

      - name: Upload PIT Mutation Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pitest-reports
          path: |
            **/target/pit-reports/
          retention-days: 7
          if-no-files-found: warn

      - name: Generate Mutation Test Summary
        if: always()
        run: |
          echo "## 🧬 Mutation Testing Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -d "target/pit-reports" ]; then
            echo "### ✅ Mutation Tests Completed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Reports Location:** \`target/pit-reports/\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            # Check for index.html to provide direct link info
            if [ -f "target/pit-reports/index.html" ]; then
              echo "📊 Full HTML report available in artifacts" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "### ⚠️ No Mutation Reports Generated" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Mutation Test Artifacts:** Download from the 'Artifacts' section above" >> $GITHUB_STEP_SUMMARY

      - name: Comment PR with Mutation Test Results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            const reportsPath = 'target/pit-reports';
            let comment = '## 🧬 Mutation Testing Results\n\n';
            
            if (fs.existsSync(reportsPath)) {
              comment += '✅ **Mutation tests have been executed**\n\n';
              comment += '**Generated Reports:**\n';
              comment += '- View detailed mutation analysis in the [PIT Reports](https://en.wikipedia.org/wiki/Mutation_testing) artifacts\n';
              comment += '- Artifacts can be downloaded from the workflow run details\n\n';
            } else {
              comment += '⚠️ **No mutation reports were generated**\n\n';
            }
            
            comment += '---\n';
            comment += '_Mutation testing helps identify weaknesses in your test suite by introducing code mutations._\n';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Check Mutation Tests Status
        if: failure() && steps.mutation-tests.conclusion == 'failure'
        run: |
          echo "❌ Mutation tests failed!"
          echo "Please review the test output and mutation report artifacts."
          exit 1
