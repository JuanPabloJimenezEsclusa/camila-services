title: Camila Services
tagline: Product classification & ranking microservices platform
description: >-
  Camila Services is a comprehensive microservices platform for product
  classification and ranking using a weighted algorithm. Built with
  hexagonal architecture, reactive programming, and modern Java.

remote_theme: just-the-docs/just-the-docs
logo: "/.docs/logo.svg"

color_scheme: dark

nav_enabled: true

aux_links_new_tab: true
aux_links:
  "GitHub Repository":
    - "https://github.com/JuanPabloJimenezEsclusa/camila-services"
  "Gitlab Repository":
    - "https://gitlab.com/side-projects9205424/camila-services"
  "Bitbucket Repository":
    - "https://bitbucket.org/jpje-side-projects/camila-services/src/main"
  "SonarCloud Dashboard":
    - "https://sonarcloud.io/summary/new_code?id=JuanPabloJimenezEsclusa_camila-services"

search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10

heading_anchors: true

back_to_top: true
back_to_top_text: "Back to top"

breadcrumbs: true
breadcrumbs_separator: " / "

disable_disk_cache: true
gh_edit_link: false

footer_content: >-
  &copy; 2026 <a href="https://github.com/JuanPabloJimenezEsclusa">Juan Pablo Jimenez Esclusa</a>.
  Licensed under GNU General Public License v3.0.

callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: yellow
  highlight:
    title: Important
    color: green
  experimental:
    title: Experimental
    color: purple

kramdown:
  input: GFM
  syntax_highlighter: rouge
  html_to_native: true
  hard_wrap: true
  parse_block_html: true
  parse_span_html: true

plugins:
  - jekyll-seo-tag
  - jekyll-github-metadata
  - jekyll-sitemap
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-redirect-from
  - jekyll-archives
  - jekyll-paginate
  - jekyll-robots-txt
  - jekyll-analytics

include:
  - AGENTS.md
  - .docs
  - .operate

exclude:
  - .gitignore
  - .editorconfig
  - .gitattributes
  - .pre-commit-config.yml
  - .spectral.yml
  - .project
  - .settings/
  - .gradle/
  - .mvn/
  - .claude/
  - node_modules/
  - vendor/
  - Gemfile
  - Gemfile.lock
  - pom.xml
  - build.gradle
  - settings.gradle
  - gradle.properties
  - src/
  - target/
  - build/
  - bin/
  - tmp/
  - CHANGELOG.md
