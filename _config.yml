title: Camila Services
tagline: Product classification & ranking microservices platform
description: >-
  Camila Services is a comprehensive microservices platform for product
  classification and ranking using a weighted algorithm. Built with
  hexagonal architecture, reactive programming, and modern Java.

remote_theme: just-the-docs/just-the-docs
logo: "/.docs/logo.svg"

color_scheme: dark

aux_links:
  "GitHub Repository":
    - "https://github.com/JuanPabloJimenezEsclusa/camila-services"
  "SonarCloud Dashboard":
    - "https://sonarcloud.io/summary/new_code?id=JuanPabloJimenezEsclusa_camila-services"

aux_links_new_tab: true

search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10

heading_anchors: true

back_to_top: true
back_to_top_text: "Back to top"

footer_content: >-
  &copy; 2026 <a href="https://github.com/JuanPabloJimenezEsclusa">Juan Pablo Jimenez Esclusa</a>.
  Licensed under MIT. Built with <a href="https://just-the-docs.com">Just the Docs</a>.

callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: yellow
  highlight:
    title: Important
    color: green
  experimental:
    title: Experimental
    color: purple

collections:
  docs:
    permalink: "/:collection/:path/"
    output: true

just_the_docs:
  collections:
    docs:
      name: Documentation

kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-seo-tag
  - jekyll-github-metadata
  - jekyll-sitemap
  - jekyll-remote-theme

exclude:
  - .gitignore
  - .editorconfig
  - .gitattributes
  - .pre-commit-config.yml
  - .spectral.yml
  - .project
  - .settings/
  - .gradle/
  - .mvn/
  - .claude/
  - node_modules/
  - vendor/
  - Gemfile
  - Gemfile.lock
  - pom.xml
  - build.gradle
  - settings.gradle
  - gradle.properties
  - sonar-project.properties
  - camila-admin/
  - camila-coverage-jacoco/
  - camila-gateway/
  - camila-orchestrator/
  - camila-performance/
  - camila-product-api/
  - src/
  - target/
  - bin/
  - tmp/
