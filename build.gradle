plugins {
  // https://plugins.gradle.org/
  id 'java'
  id 'jacoco'
  id 'pmd'
  id 'org.sonarqube' version '7.2.3.7755'
  id 'org.springframework.boot' version '3.5.13' apply false
  id 'io.spring.dependency-management' version '1.1.7' apply false
  id 'org.graalvm.buildtools.native' version '1.0.0' apply false
  id 'com.github.spotbugs' version '6.5.1' apply false
  id 'org.openapi.generator' version '7.21.0' apply false
  id 'org.openrewrite.rewrite' version '7.30.0' apply false
  id 'org.springdoc.openapi-gradle-plugin' version '1.9.0' apply false
  id "io.freefair.lombok" version "9.2.0" apply false
  id 'info.solidsoft.pitest' version '1.19.0' apply false
  id 'com.github.ben-manes.versions' version '0.54.0'
  id 'org.owasp.dependencycheck' version '12.2.1' apply false
}

allprojects {
  group = 'com.camila.core'
  version = '1.0.0'

  repositories {
    mavenCentral()
    gradlePluginPortal()
    mavenLocal()
  }
}

subprojects {
  apply plugin: 'java'
  apply plugin: 'io.spring.dependency-management'
  apply plugin: 'org.springframework.boot'
  apply plugin: 'jacoco'
  apply plugin: 'checkstyle'
  apply plugin: 'io.freefair.lombok'

  java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
  }

  // ✅ Error Prone Configuration - Strict compile-time checks
  // Enable with: gradle build -PerrorProne
  if (project.hasProperty('errorProne')) {
    configurations {
      errorproneConfig
    }

    dependencies {
      compileOnly 'com.google.errorprone:error_prone_annotations:2.49.0'
      errorproneConfig 'com.google.errorprone:error_prone_core:2.49.0'
    }

    tasks.withType(JavaCompile) {
      // Use Error Prone compiler with strict checks
      options.compilerArgs += [
        '-Xlint:all',                   // Enable all compiler warnings
        '-Werror',                      // Treat warnings as errors
        '-XepAllDisabledChecks',        // Fallback for strict mode
      ]

      // Configure javac for Error Prone
      def errorproneJar = configurations.errorproneConfig.asPath
      if (errorproneJar) {
        options.fork = true
        options.forkOptions.executable = 'javac'
        options.forkOptions.jvmArgs += "-Xbootclasspath/p:${errorproneJar}"
      }

      options.encoding = 'UTF-8'
      options.incremental = true

      doFirst {
        println "🔍 Compiling with Error Prone strict checking (v2.45.0) enabled"
      }
    }
  }

  // ✅ Pitest Configuration - Mutation Testing for Code Quality
  // Pitest (info.solidsoft.pitest v1.15.0) requires opt-in configuration per module
  // Apply to specific modules with: apply plugin: 'info.solidsoft.pitest'
  // Then configure with pitest { ... } block below
  // Enable root-level: gradle mutationTest (aggregates from subprojects)

  // Pitest configuration template (apply to modules as needed)
  pluginManager.withPlugin('info.solidsoft.pitest') {
    pitest {
      // Pitest version and plugin
      pitestVersion = "1.22.0"
      junit5PluginVersion = "1.2.1"

      // Mutation testing configuration
      threads = Runtime.runtime.availableProcessors()     // Parallel execution
      timeoutFactor = 2.0                                  // Timeout multiplier
      timeoutConstant = 5000                               // Base timeout (ms)

      // Coverage quality gates
      mutationThreshold = 80                               // Fail if < 80% mutation score
      coverageThreshold = 80                               // Code coverage requirement

      // Exclude generated and infrastructure code
      excludedClasses = [
        '**/input/grpc/**',
        '**/input/rest/api/**',
        '**/input/rest/dto/**',
        '**/*MapperImpl**',
        '**/generated/**'
      ]

      // Exclude specific methods
      excludedMethods = [
        '*Config*',                  // Configuration classes
        '*equals',                   // hashCode/equals methods
        '*hashCode',
        '*toString*',
        '*lambda*',
        'finalize'
      ]

      // Exclude specific lines/annotations
      excludedTestClasses = [
        '**/*ITCase*',               // Integration tests
        '**/*Behaviour*'             // BDD tests
      ]

      // Report generation
      outputFormats = ['XML', 'HTML']

      // Mutations to use
      mutators = [
        'DEFAULTS',                  // Standard mutators
        'STRONGER',                  // Additional stronger mutators
        'REMOVE_CONDITIONALS',       // Remove conditional bounds
        'REMOVE_INCREMENTS',         // Remove increments
        'REPLACE_BOOLEAN_RETURN'     // Replace boolean returns
      ]

      // Features
      useClasspathJar = true
      verbose = false
      failWhenNoMutations = false    // Don't fail if no mutations found
    }
  }

  // ✅ SpotBugs Configuration - Static Bug Detection
  // Enable with: gradle check or gradle spotbugsReport
  apply plugin: 'com.github.spotbugs'

  spotbugs {
    // SpotBugs version
    toolVersion = "4.9.8"
    // Report configuration
    ignoreFailures = false           // Fail if bugs found
  }

  // Configure SpotBugs task with filters
  afterEvaluate {
    if (tasks.findByName('spotbugsMain')) {
      spotbugsMain {
        reports {
          html {
            required = true
          }
          xml {
            required = true
          }
        }
        // Include and exclude filters
        includeFilter = rootProject.file('src/main/resources/spotbugs-security-include.xml')
        excludeFilter = rootProject.file('src/main/resources/spotbugs-security-exclude.xml')
      }
      // Disable test analysis
      spotbugsTest.enabled = false
    }
  }

  // Add SpotBugs to quality verification task
  tasks.named('check') { dependsOn 'spotbugsMain' }

  tasks.register('spotbugsReport') {
    group = 'verification'
    description = 'Run SpotBugs static analysis'
    dependsOn 'spotbugsMain'

    doLast {
      println """
      ✅ SpotBugs analysis complete!
      📊 Report: build/reports/spotbugs/main.html
      📈 View details with: open build/reports/spotbugs/main.html
      """
    }
  }

  tasks.register('mutationTest') {
    group = 'verification'
    description = 'Run mutation tests with Pitest'
    dependsOn 'pitest'

    doLast {
      println """
      ✅ Mutation testing complete!
      📊 Report: build/reports/pitest/index.html
      📈 Check coverage with: open build/reports/pitest/index.html
      """
    }
  }

  ext {
    springBootVersion = '3.5.13'
    springFrameworkVersion = '6.2.11'
    springCloudVersion = '2025.0.2'
    springBootAdminVersion = '3.5.8'

    // jakarta
    javaxAnnotationApiVersion = '1.3.2'

    // Observability
    opentelemetryVersion = '1.61.0'
    opentelemetryApiIncubatorVersion = '1.61.0-alpha'

    // Database
    couchbaseJavaClientVersion = '3.11.2'

    // Testing
    testcontainersVersion = '2.0.4'
    testcontainersRedis = '2.2.4'
    cucumberVersion = '7.34.3'
    junitVersion = '6.0.3'
    junitPlatformSuiteVersion = '6.0.3'
    archunitJunit5Version = '1.4.2'
    instancioJunitVersion = '5.5.1'
    awaitilityVersion = '4.3.0'
    jmhVersion = '1.37'
    jacocoVersion = '0.8.14'
    okhttpVersion = '5.3.2'

    // API Documentation
    springdocOpenapiVersion = '2.8.17'
    graphqlJavaVersion = '25.0'
    graphqlJavaExtendedScalarsVersion = '24.0'

    // GRPC
    protobufJavaVersion = '4.33.2'
    grpcVersion = '1.80.0'
    grpcServerSpringBootStarterVersion = '3.1.0.RELEASE'

    // Tools
    lombokVersion = '1.18.38'
    mapstructVersion = '1.6.3'
    jspecifyVersion = '1.0.0'
    commonsLang3 = '3.20.0'
    chaosMonkeySpringBootVersion = '3.3.0'

    // Plugins
    flattenmavenpluginVersion = '1.7.3'
    pitestavenmavenpluginVersion = '1.21.0'
    jimgemavenPluginVersion = '3.4.6'
    gitCommitIdMavenPluginVersion = '9.0.2'
    mavenSitePluginVersion = '3.21.0'
    mavenCheckstylePluginVersion = '3.6.0'
    mavenCompilerPluginVersion = '3.14.1'
    dependencyCheckMavenVersion = '12.1.9'
    checkstyleVersion = '12.3.0'
    mavenProjectInfoReportsPluginVersion = '3.9.0'
    chaosMonkeySpringBootVersion = '3.2.0'
  }

  dependencyManagement {
    imports {
      mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
      mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
      mavenBom "de.codecentric:spring-boot-admin-dependencies:${springBootAdminVersion}"
      mavenBom "org.testcontainers:testcontainers-bom:${testcontainersVersion}"
      mavenBom "org.junit:junit-bom:${junitVersion}"
    }

    dependencies {
      // OpenTelemetry Dependencies
      dependency "io.opentelemetry:opentelemetry-api:${opentelemetryVersion}"
      dependency "io.opentelemetry:opentelemetry-sdk:${opentelemetryVersion}"
      dependency "io.opentelemetry:opentelemetry-context:${opentelemetryVersion}"
      dependency "io.opentelemetry:opentelemetry-sdk-logs:${opentelemetryVersion}"
      dependency "io.opentelemetry:opentelemetry-sdk-common:${opentelemetryVersion}"
      dependency "io.opentelemetry:opentelemetry-sdk-trace:${opentelemetryVersion}"
      dependency "io.opentelemetry:opentelemetry-sdk-metrics:${opentelemetryVersion}"
      dependency "io.opentelemetry:opentelemetry-extension-trace-propagators:${opentelemetryVersion}"
      dependency "io.opentelemetry:opentelemetry-api-incubator:${opentelemetryApiIncubatorVersion}"

      // Couchbase
      dependency "com.couchbase.client:java-client:${couchbaseJavaClientVersion}"

      // Provide jspecify annotations to all subprojects so @NullMarked is available at compile time
      dependency "org.jspecify:jspecify:${jspecifyVersion}"

      // Pin junit-platform artifacts (ensure Cucumber engine finds required classes)
      dependency "org.junit.platform:junit-platform-engine:${junitPlatformSuiteVersion}"
      dependency "org.junit.platform:junit-platform-commons:${junitPlatformSuiteVersion}"
      dependency "org.junit.platform:junit-platform-launcher:${junitPlatformSuiteVersion}"
      dependency "org.junit.platform:junit-platform-suite:${junitPlatformSuiteVersion}"
      dependency "org.junit.jupiter:junit-jupiter:${junitVersion}"
    }
  }

  dependencies {
    compileOnly "org.jspecify:jspecify:${jspecifyVersion}"
  }

  checkstyle {
    toolVersion = "${checkstyleVersion}"
    configFile = file("${rootDir}/src/main/resources/checkstyle.xml")
  }

  tasks.withType(Checkstyle) {
    exclude '**/input/grpc/**'
    exclude '**/input/rest/api/**'
    exclude '**/input/rest/dto/**'
    exclude '**/input/security/*Config**'
    exclude '**/*MapperImpl**'
    exclude '**/generated/**'
    exclude '**/benchmark/**'
  }

  tasks.withType(Test) {
    // Default to JUnit Platform so JUnit 5 tests are discovered across subprojects
    useJUnitPlatform()
    // Don't fail the build when test discovery finds no tests (some modules have test sources but
    // use custom suites or only integration tests). The unitTest task still enforces discovery.
    failOnNoDiscoveredTests = false

    // Disable Eureka/discovery during unit tests to avoid background HTTP calls to localhost:8761
    // Tests that require discovery can explicitly enable it via system properties.
    systemProperty 'eureka.client.enabled', 'false'
    systemProperty 'spring.cloud.discovery.enabled', 'false'

    // This excludes the server auto-configuration classes so tests that start the whole context
    // won't attempt to create Eureka server beans locally.
    def excluded = 'org.springframework.cloud.netflix.eureka.server.EurekaServerAutoConfiguration'
    // If there are other server classes to exclude, comma-separate them
    systemProperty 'spring.autoconfigure.exclude', excluded
  }

  tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    // If you run gradle ... -PerrorProne the build will enable stricter compiler flags
    if (project.hasProperty('errorProne')) {
      options.compilerArgs += ['-Xlint:all', '-Werror']
      println "ErrorProne mode enabled for project ${project.name}"
    }
  }

  bootJar {
    requiresUnpack '**/repackaged/**'
    layered {
      enabled = true
    }
  }

  springBoot {
    buildInfo()
  }

  tasks.register('unitTest', Test) {
    description = 'Runs unit tests only'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    include("**/*Test.class")
    exclude("**/*ITCase.class", "**/*Behaviour**")

    useJUnitPlatform {
      excludeTags 'integration', 'cucumber'
    }
  }

  tasks.named('check') {
    dependsOn tasks.named('unitTest')
  }

  // Replace the existing registration block for jacocoAllTestReport with a provider variable so we can
  // configure the root aggregation dependency without forcing task creation in other projects.
  tasks.register('jacocoAllTestReport', JacocoReport) {
    executionData fileTree(project.buildDir).include("/jacoco/*.exec")
    reports {
      xml.required = true
      html.required = true
    }

    def jacocoExcludes = [
      '**/input/grpc/**',
      '**/input/rest/api/**',
      '**/input/rest/dto/**',
      '**/input/security/*Config**',
      '**/*MapperImpl**'
    ]
    classDirectories.setFrom(files({
      // Collect class directories from the main sourceSet and apply the exclude filter lazily
      project.sourceSets.main.output.classesDirs.files.collect { dir ->
        fileTree(dir: dir, exclude: jacocoExcludes)
      }
    }))
  }.configure { reportTask ->
    // Attach the subproject jacoco report task as a dependency of the root aggregate task
    rootProject.tasks.named('aggregateJacoco') { dependsOn reportTask }
  }
}

// Define a task to be run instead of top-level jar
task emptyJar(type: Jar) {
  archiveFileName = 'empty.jar'
}

jar.enabled = false
artifacts.archives emptyJar

// Root aggregation task for jacoco reports from subprojects. Each subproject will attach its
// own jacocoAllTestReport provider to this task without forcing cross-project evaluation.
tasks.register('aggregateJacoco') {
  group = 'verification'
  description = 'Aggregate jacocoAllTestReport from subprojects'
}

// ✅ Mutation Testing Aggregation Task
// Run mutation tests across all subprojects
tasks.register('mutationTest') {
  group = 'verification'
  description = 'Run mutation tests with Pitest across all subprojects'
  dependsOn subprojects.collect { p -> p.tasks.findByName('mutationTest') }.findAll { it != null }
}

// Sonar token helper: read from project property 'sonar.token' or environment variable SONAR_TOKEN
// This is used to decide whether to run Sonar analysis and to provide credentials to the plugin.
ext.sonarToken = findProperty('sonar.token') ?: System.getenv('SONAR_TOKEN')

sonar {
  properties {
    property "sonar.organization", "juanpablojimenezesclusa"
    property "sonar.host.url", "https://sonarcloud.io"
    property "sonar.projectKey", "JuanPabloJimenezEsclusa_camila-services"
    property "sonar.scm.exclusions.disabled", "true"
    property "sonar.coverage.jacoco.xmlReportPaths", "camila-product-api/build/reports/jacoco/test/jacocoTestReport.xml"
    property "sonar.exclusions", "**/input/grpc/**,**/input/rest/api/**,**/input/rest/dto/**,**/input/security/*Config**,**/*MapperImpl**"
    property "sonar.branch.name", "develop"

    // Only set token property if we actually have it; otherwise don't configure it here
    if (rootProject.ext.sonarToken) {
      property "sonar.token", rootProject.ext.sonarToken
      // sonar.login is commonly used by Sonar; set it too for compatibility
      property "sonar.login", rootProject.ext.sonarToken
    }
  }
}

// ✅ OpenRewrite Configuration - Automated Code Refactoring
// Enable with: gradle rewriteRun or gradle rewriteDryRun
apply plugin: 'org.openrewrite.rewrite'

rewrite {
  // OpenRewrite version
  version = "7.23.0"

  // Fail the build if there are issues
  failOnDryRunResults = false

  // Active recipes for code refactoring and formatting
  activeRecipes = [
    // Maven best practices
    'org.openrewrite.maven.BestPractices',
    'org.openrewrite.maven.ModernizeObsoletePoms',
    'org.openrewrite.maven.OrderPomElements',

    // YAML formatting
    'org.openrewrite.yaml.format.Indents',

    // HCL/Terraform formatting
    'org.openrewrite.hcl.format.BlankLines',
    'org.openrewrite.hcl.format.NormalizeFormat',
    'org.openrewrite.hcl.format.RemoveTrailingWhitespace',
    'org.openrewrite.hcl.format.Spaces',

    // Java formatting and imports
    'org.openrewrite.java.format.EmptyNewlineAtEndOfFile',
    'org.openrewrite.java.format.MethodParamPad',
    'org.openrewrite.java.format.NormalizeFormat',
    'org.openrewrite.java.format.NoWhitespaceAfter',
    'org.openrewrite.java.format.NoWhitespaceBefore',
    'org.openrewrite.java.format.OperatorWrap',
    'org.openrewrite.java.format.PadEmptyForLoopComponents',
    'org.openrewrite.java.format.RemoveTrailingWhitespace',
    'org.openrewrite.java.format.Spaces',
    'org.openrewrite.java.OrderImports',
    'org.openrewrite.java.RemoveUnusedImports'
  ]

  // Code style definitions
  activeStyles = [
    'org.openrewrite.java.IntelliJ',     // IntelliJ IDEA style
    'org.openrewrite.java.SpringFormat'  // Spring Boot code style
  ]
}

tasks.register('codeRewrite') {
  group = 'refactoring'
  description = 'Run OpenRewrite recipes to refactor code'
  dependsOn 'rewriteRun'
}

tasks.register('codeRewritePreview') {
  group = 'refactoring'
  description = 'Preview OpenRewrite changes (dry run)'
  dependsOn 'rewriteDryRun'
}

// Composite task to run build + quality checks. Use -PerrorProne and -PqualityCheck to enable extra steps.
tasks.register('qualityBuild') {
  group = 'verification'
  description = 'Runs clean, build and optional quality checks. Opt-in flags: -PerrorProne -PqualityCheck'
  dependsOn 'clean', 'build', 'aggregateJacoco'

  doFirst {
    println "Starting qualityBuild. Flags: errorProne=${project.hasProperty('errorProne')}, qualityCheck=${project.hasProperty('qualityCheck')}"
  }

  // If user requests qualityCheck, run Sonar analysis (prefer 'sonar' task; fall back to 'sonarqube')
  if (project.hasProperty('qualityCheck')) {
    def sonarTaskName = tasks.findByName('sonar') ? 'sonar' : 'sonarqube'

    if (rootProject.ext.sonarToken) {
      dependsOn sonarTaskName
    } else {
      // Don't fail the build when token is missing; print an informative message instead.
      doFirst {
        println "Skipping Sonar analysis: set the project property 'sonar.token' or env var SONAR_TOKEN to enable."
      }
    }
  }
}

// Wire jacocoAllTestReport dependencies after all projects are evaluated to avoid touching
// subproject evaluation state during root project configuration (prevents "cannot be executed in the current context").
gradle.projectsEvaluated {
  def quality = tasks.named('qualityBuild')

  // Wire jacoco reports
  def jacocoProviders = subprojects.collect { p ->
    p.tasks.findByName('jacocoAllTestReport') != null ? p.tasks.named('jacocoAllTestReport') : null
  }.findAll { it != null }

  if (!jacocoProviders.isEmpty()) {
    quality.configure { dependsOn jacocoProviders }
  }

  // Wire mutation tests to quality build when -Ppitest flag is set
  if (project.hasProperty('pitest')) {
    quality.configure { dependsOn 'mutationTest' }
  }
}

// Configure version updates plugin
dependencyUpdates {
  checkForGradleUpdate = true
  outputFormatter = "plain,html,xml"
  outputDir = "build/dependencyUpdates"
  reportfileName = "dependency-updates-report"
}

// Task aliases to match Maven commands
tasks.register('displayDependencyUpdates') {
  group = 'help'
  description = 'Display dependency updates (Maven equivalent: versions:display-dependency-updates)'
  dependsOn 'dependencyUpdates'
  doLast {
    println "Dependency updates report generated. See build/dependencyUpdates/dependency-updates-report.txt"
  }
}

tasks.register('displayPluginUpdates') {
  group = 'help'
  description = 'Display plugin updates (Maven equivalent: versions:display-plugin-updates)'
  dependsOn 'dependencyUpdates'
  doLast {
    println "Plugin updates included in dependency updates report. See build/dependencyUpdates/dependency-updates-report.txt"
  }
}
