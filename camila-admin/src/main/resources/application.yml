spring:
  application:
    name: "@project.name@"
  # https://docs.spring.io/spring-boot/reference/features/spring-application.html#features.spring-application.virtual-threads
  threads:
    virtual:
      enabled: true
  banner:
    # https://www.ascii-art-generator.org/
    location: classpath:/admin-banner.txt
  profiles:
    active:
      - ${SPRING_PROFILES_ACTIVE:loc}
  boot:
    admin:
      discovery:
        ignored-services: consul
  config:
    import: "optional:consul:"
  cloud:
    consul:
      enabled: true
      host: ${CONSUL_HOST:localhost}
      port: ${CONSUL_PORT:8500}
      discovery:
        enabled: true
        prefer-ip-address: true
        health-check-path: /actuator/health
        health-check-interval: 15s
        instance-id: ${spring.application.name}:${random.value}
        service-name: ${spring.application.name}
      config:
        enabled: true
        prefix: config
        default-context: application
        format: YAML
        watch:
          wait-time: 30

info:
  app:
    name: "@project.name@"
    version: "@project.version@"

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    env:
      show-values: ALWAYS
      post:
        enabled: true
      cache:
        time-to-live: 60s
      access: unrestricted
    info:
      cache:
        time-to-live: 3600s
      access: unrestricted
    beans:
      cache:
        time-to-live: 10s
      access: unrestricted
    health:
      show-details: ALWAYS
      show-components: ALWAYS
      access: unrestricted
    configprops:
      show-values: ALWAYS
      access: unrestricted
    shutdown:
      access: unrestricted
    prometheus:
      access: unrestricted
  info:
    env:
      enabled: true
    git:
      enabled: true
      mode: full
    os:
      enabled: true
    process:
      enabled: true
    build:
      enabled: true
    java:
      enabled: true

server:
  port: ${PORT:8100}
  forward-headers-strategy: framework

logging:
  level:
    org.springframework.boot: DEBUG
    org.springframework: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} ${LOG_LEVEL_PATTERN:-%5p} %m%n"

---
###### Test properties ######
spring:
  config:
    activate:
      on-profile: "test"
  cloud:
    consul:
      enabled: false
      discovery:
        enabled: false
      config:
        enabled: false
