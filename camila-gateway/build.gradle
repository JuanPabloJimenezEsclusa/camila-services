plugins {
  id 'java'
  id 'jacoco'
  id 'org.springframework.boot'
  id 'io.spring.dependency-management'
  id 'org.springdoc.openapi-gradle-plugin'
}

description = 'Camila Service Gateway'
group = 'com.camila.gateway'
version = '1.0.0'

dependencies {
  // Spring Boot
  implementation 'org.springframework.boot:spring-boot-starter-webflux'
  implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'
  implementation 'org.springframework.boot:spring-boot-starter-actuator'
  implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
  developmentOnly 'org.springframework.boot:spring-boot-devtools'

  // Spring Cloud
  implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'
  implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-reactor-resilience4j'
  implementation 'org.springframework.cloud:spring-cloud-starter-consul-discovery'
  implementation 'org.springframework.cloud:spring-cloud-starter-consul-config'

  // Observability
  implementation 'io.micrometer:micrometer-tracing-bridge-otel'
  implementation 'io.micrometer:micrometer-registry-prometheus'
  implementation 'io.opentelemetry:opentelemetry-exporter-zipkin'
  implementation 'io.opentelemetry.instrumentation:opentelemetry-spring-boot-starter'

  // API Documentation
  implementation("org.springdoc:springdoc-openapi-starter-webflux-ui:${springdocOpenapiVersion}") {
    exclude group: 'org.apache.commons', module: 'commons-lang3'
  }

  // Utilities
  compileOnly 'org.projectlombok:lombok'
  annotationProcessor 'org.projectlombok:lombok'
  implementation "org.apache.commons:commons-lang3:${commonsLang3}"
  implementation "org.jspecify:jspecify:${jspecifyVersion}"

  // Testing
  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testImplementation 'org.springframework.boot:spring-boot-starter-webflux-test'
  testImplementation 'io.projectreactor:reactor-test'
  testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
  testImplementation "com.redis:testcontainers-redis:${testcontainersRedis}"
  testImplementation "com.squareup.okhttp3:mockwebserver:${okhttpVersion}"
  testImplementation "com.squareup.okhttp3:okhttp:${okhttpVersion}"
}

dependencyManagement {
  imports {
    mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
  }
}

tasks.named('test') {
  useJUnitPlatform()
}

jacoco {
  toolVersion = "${jacocoVersion}"
}

jacocoTestReport {
  reports {
    xml.required = true
    html.required = true
  }

  afterEvaluate {
    classDirectories.setFrom(files(classDirectories.files.collect {
      fileTree(dir: it, exclude: [
        '**/input/grpc/**',
        '**/input/rest/api/**',
        '**/input/rest/dto/**',
        '**/input/security/*Config**',
        '**/*MapperImpl**'
      ])
    }))
  }
}

openApi {
  apiDocsUrl = "http://localhost:8080/v3/api-docs"
  outputDir = file("$buildDir/docs")
  outputFileName = "openapi.json"
}

// Process Maven-style property placeholders in resources (like @project.name@, @project.version@)
// This ensures compatibility between Maven and Gradle builds
processResources {
  filesMatching(['application*.yml', 'application*.yaml']) {
    filter { line ->
      line.replace('@project.name@', project.name)
          .replace('@project.version@', project.version.toString())
          .replace('@project.artifactId@', project.name)
          .replace('@project.groupId@', project.group.toString())
    }
  }
}

processTestResources {
  filesMatching(['application*.yml', 'application*.yaml']) {
    filter { line ->
      line.replace('@project.name@', project.name)
          .replace('@project.version@', project.version.toString())
          .replace('@project.artifactId@', project.name)
          .replace('@project.groupId@', project.group.toString())
    }
  }
}
