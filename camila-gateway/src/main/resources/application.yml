spring:
  application:
    name: "@project.name@"
  # https://docs.spring.io/spring-boot/reference/features/spring-application.html#features.spring-application.virtual-threads
  threads:
    virtual:
      enabled: true
  banner:
    # https://www.ascii-art-generator.org/
    location: classpath:/gateway-banner.txt
  profiles:
    active:
      - ${SPRING_PROFILES_ACTIVE:loc}
  config:
    import: "optional:configserver:${CONFIG_SERVER_URI:}"
  # https://cloud.spring.io/spring-cloud-gateway/reference/html/
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USER:default}
      password: ${REDIS_PASSWORD:camila}
      timeout: 20000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
  cloud:
    config:
      enabled: true
      retry:
        max-attempts: 10
        max-interval: 10000
        initial-interval: 1000
        multiplier: 1.1
      discovery:
        enabled: true
        service-id: "camila-config"
      label: main
      profile: ${SPRING_PROFILES_ACTIVE}
      name: ${spring.application.name}
      allow-override: true
    loadbalancer:
      health-check:
        initial-delay: 5s
        interval: 30s
      retry:
        backoff:
          enabled: true
    discovery:
      enabled: true
    gateway.server.webflux:
      metrics:
        enabled: true
      routes:
        - id: products
          uri: ${PRODUCT_SERVER_URL:http://localhost:8080/}
          predicates:
            - Path=/product-*/api/**
          metadata:
            cors:
              allowedOrigins: '*'
              allowedMethods: '*'
              allowedHeaders: '*'
              maxAge: 30
          filters:
            - name: RemoveRequestHeader
              args:
                name: Cookie
            - name: TokenRelay
            - name: RequestRateLimiter
              # https://docs.spring.io/spring-cloud-gateway/reference/spring-cloud-gateway-server-webflux/gatewayfilter-factories/requestratelimiter-factory.html#redis-ratelimiter
              args:
                key-resolver: '#{@userKeyResolver}'
                redis-rate-limiter.replenishRate: ${gateway.replenishRate:1000}
                redis-rate-limiter.burstCapacity: ${gateway.burstCapacity:2000}
                redis-rate-limiter.requestedTokens: ${gateway.requestedTokens:1}
            - name: CircuitBreaker
              args:
                name: fallbackCircuitBreaker
                fallbackUri: forward:/fallback
                # ReactiveResilience4JCircuitBreakerFactory.java (review)
                minimumNumberOfCalls: 100
            - name: Retry
              args:
                retries: 3
                statuses: BAD_REQUEST, INTERNAL_SERVER_ERROR, BAD_GATEWAY, GATEWAY_TIMEOUT
                methods: GET, POST, HEAD, OPTIONS
                backoff:
                  firstBackoff: 10ms
                  maxBackoff: 50ms
                  factor: 2
                  basedOnPreviousValue: false
            - name: RequestSize
              args:
                maxSize: 10000
      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedHeaders:
              - "Origin"
              - "Content-Type"
              - "Accept"
              - "Authorization"
              - "Referer"
            allowedMethods:
              - POST
              - GET
              - OPTIONS
      httpclient:
        ssl:
          use-insecure-trust-manager: true
      filter:
        request-rate-limiter:
          enabled: true
        circuit-breaker:
          enabled: true
        retry:
          enabled: true
        fallback-headers:
          enabled: true
      default-filters:
        - TokenRelay
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin, RETAIN_FIRST
  main:
    web-application-type: reactive
    lazy-initialization: true

# https://docs.spring.io/spring-cloud-circuitbreaker/docs/current/reference/html/spring-cloud-circuitbreaker-resilience4j.html#_circuit_breaker_properties_configuration
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 1000
        permittedNumberOfCallsInHalfOpenState: 100
        failureRateThreshold: 50
        waitDurationInOpenState: 10
        registerHealthIndicator: true
    instances:
      fallbackCircuitBreaker:
        baseConfig: default
  timelimiter:
    configs:
      default:
        timeoutDuration: 120s
    instances:
      fallbackCircuitBreaker:
        baseConfig: default

info:
  app:
    name: "@project.name@"
    version: "@project.version@"

# openapi
springdoc:
  swagger-ui:
    filter: true
    show-common-extensions: true
    doc-expansion: none
    operations-sorter: method
    deep-linking: true
    display-request-duration: true
    defaultModelsExpandDepth: 1
    tagsSorter: alpha
    path: /swagger-ui.html
    config-url: /v3/api-docs/swagger-config
    urls:
      - name: API Gateway Service
        url: /v3/api-docs
      - name: API Products Service
        url: /product-dev/api/v3/api-docs
  show-actuator: true
  api-docs:
    enabled: true
    groups:
      enabled: true
    resolve-schema-properties: true

# actuator
management:
  health:
    redis:
      enabled: true
    circuitbreakers:
      enabled: true
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    env:
      show-values: ALWAYS
      cache:
        time-to-live: 60s
      access: unrestricted
    info:
      cache:
        time-to-live: 3600s
      access: unrestricted
    beans:
      cache:
        time-to-live: 10s
      access: unrestricted
    health:
      show-details: ALWAYS
      show-components: ALWAYS
      access: unrestricted
    configprops:
      show-values: ALWAYS
      access: unrestricted
    shutdown:
      access: unrestricted
    prometheus:
      access: unrestricted
  info:
    env:
      enabled: true
    git:
      enabled: true
      mode: full
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}
      connect-timeout: 10s
      read-timeout: 30s

server:
  port: ${PORT:8090}
  forward-headers-strategy: framework

# traces
logging:
  level:
    org.springframework: DEBUG
    org.springframework.boot: DEBUG
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG
    org.springframework.cloud.gateway: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} ${LOG_LEVEL_PATTERN:-%5p} %m%n"

# discovery
eureka:
  client:
    enabled: true
    serviceUrl:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
    healthcheck:
      enabled: true
  instance:
    preferIpAddress: true
    statusPageUrlPath: actuator/info
    healthCheckUrlPath: actuator/health
    nonSecurePortEnabled: true
    leaseRenewalIntervalInSeconds: 15

