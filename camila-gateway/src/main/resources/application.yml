spring:
  application:
    name: "@project.name@"
  # https://docs.spring.io/spring-boot/reference/features/spring-application.html#features.spring-application.virtual-threads
  threads:
    virtual:
      enabled: true
  banner:
    # https://www.ascii-art-generator.org/
    location: classpath:/gateway-banner.txt
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:loc}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USER:default}
      password: ${REDIS_PASSWORD:camila}
      timeout: 20000ms
      lettuce:
        pool:
          max-active: 256
          max-idle: 64
          min-idle: 16
  cloud:
    loadbalancer:
      health-check:
        initial-delay: 5s
        interval: 30s
      retry:
        backoff:
          enabled: true
    # https://cloud.spring.io/spring-cloud-gateway/reference/html/
    gateway:
      server:
        webflux:
          metrics:
            enabled: true
          routes:
            - id: products
              uri: ${PRODUCT_SERVER_URL:http://localhost:8080/}
              predicates:
                - Path=/product-*/api/**
              metadata:
                cors:
                  allowed-origin-patterns: '*'
                  allowed-methods: '*'
                  allowed-headers: '*'
                  allowCredentials: true
                  allowPrivateNetwork: true
                  max-age: 30
              filters:
                - name: RemoveRequestHeader     # Remove hop-by-hop headers
                  args:
                    name: Cookie
                - name: TokenRelay              # Relay OAuth2 token to downstream services
                - name: RequestRateLimiter      # Rate limiting using Redis
                  args:
                    key-resolver: '#{@userKeyResolver}'
                    redis-rate-limiter.enable: true
                    redis-rate-limiter.automaticExpirationAfter: ${gateway.automaticExpirationAfter:10s}
                    redis-rate-limiter.replenishRate: ${gateway.replenishRate:200}    # 200 tokens/seconds
                    redis-rate-limiter.burstCapacity: ${gateway.burstCapacity:400}    # peak of 400 tokens
                    redis-rate-limiter.requestedTokens: ${gateway.requestedTokens:1}
                - name: Retry                   # Retry on specific HTTP status codes
                  args:
                    retries: 1  # Only 1 retry to avoid cascading failures
                    statuses: INTERNAL_SERVER_ERROR, BAD_GATEWAY, GATEWAY_TIMEOUT, SERVICE_UNAVAILABLE
                    methods: GET, POST, HEAD, OPTIONS
                    backoff:
                      firstBackoff: 50ms
                      maxBackoff: 200ms
                      factor: 2
                      basedOnPreviousValue: false
                - name: CircuitBreaker          # Circuit breaker pattern
                  args:
                    name: fallbackCircuitBreaker
                    fallbackUri: forward:/fallback
                - name: DedupeResponseHeader    # Dedupe CORS headers
                  args:
                    name: Access-Control-Allow-Origin Access-Control-Allow-Credentials
                    strategy: RETAIN_FIRST      # RETAIN_FIRST or RETAIN_LAST
                - name: RequestSize             # Limit request size to prevent abuse
                  args:
                    maxSize: 10000
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowed-origin-patterns: "*"
                allowed-headers:
                  - "Origin"
                  - "Content-Type"
                  - "Accept"
                  - "Authorization"
                  - "Referer"
                allowed-methods:
                  - POST
                  - GET
                  - OPTIONS
          httpclient:
            ssl:
              use-insecure-trust-manager: true
              handshake-timeout: 10s
              close-notify-flush-timeout: 3s
              close-notify-read-timeout: 3s
          filter:
            request-rate-limiter:
              enabled: true
            retry:
              enabled: true
            circuit-breaker:
              enabled: true
            fallback-headers:
              enabled: true
            request-size:
              enabled: true
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials RETAIN_FIRST
            - TokenRelay
  main:
    web-application-type: reactive
    lazy-initialization: true

# Gateway-specific configuration properties
gateway:
  fallback:
    message: "Circuit-breaker-fallback"
  replenishRate: 200
  burstCapacity: 400
  requestedTokens: 1
  automaticExpirationAfter: 10s

# Rate limiter configuration
rate:
  limiter:
    prefix: "rl"

# https://docs.spring.io/spring-cloud-circuitbreaker/docs/current/reference/html/spring-cloud-circuitbreaker-resilience4j.html#_circuit_breaker_properties_configuration
resilience4j:
  circuitbreaker:
    configs:
      # ReactiveResilience4JCircuitBreakerFactory.java (review)
      default:
        minimumNumberOfCalls: 150                 # require almost N calls to evaluate
        permittedNumberOfCallsInHalfOpenState: 20 # number of calls when half-open
        slidingWindowSize: 50                     # number of calls to consider for the failure rate
        slidingWindowType: COUNT_BASED            # COUNT_BASED or TIME_BASED
        waitDurationInOpenState: 10s              # time to wait before attempting to close the circuit
        failureRateThreshold: 50                  # % of failures to open the circuit
        registerHealthIndicator: true
    instances:
      fallbackCircuitBreaker:
        baseConfig: default
  timelimiter:
    configs:
      default:
        timeoutDuration: 30s       # Timeout for backend call
        cancelRunningFuture: true  # Cancel the call if timeout occurs
    instances:
      fallbackCircuitBreaker:
        baseConfig: default
  bulkhead:
    configs:
      default:
        maxConcurrentCalls: 5000  # Max concurrent calls
        maxWaitDuration: 500ms    # Max wait time to acquire a thread
    instances:
      productServiceBulkhead:
        baseConfig: default
        maxConcurrentCalls: 5000

info:
  app:
    name: "@project.name@"
    version: "@project.version@"

# openapi
springdoc:
  swagger-ui:
    filter: true
    show-common-extensions: true
    doc-expansion: none
    operations-sorter: method
    deep-linking: true
    display-request-duration: true
    defaultModelsExpandDepth: 1
    tagsSorter: alpha
    path: /swagger-ui.html
    config-url: /v3/api-docs/swagger-config
    urls:
      - name: API Gateway Service
        url: /v3/api-docs
      - name: API Products Service
        url: /product-dev/api/v3/api-docs
  show-actuator: true
  api-docs:
    enabled: true
    groups:
      enabled: true
    resolve-schema-properties: true

# actuator
management:
  health:
    redis:
      enabled: true
    circuitbreakers:
      enabled: true
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    env:
      show-values: ALWAYS
      cache:
        time-to-live: 60s
    info:
      cache:
        time-to-live: 3600s
    beans:
      cache:
        time-to-live: 10s
    health:
      show-details: ALWAYS
      show-components: ALWAYS
    configprops:
      show-values: ALWAYS
  info:
    env:
      enabled: true
    git:
      enabled: true
      mode: full
    os:
      enabled: true
    process:
      enabled: true
    build:
      enabled: true
    java:
      enabled: true
  tracing:
    enabled: false

server:
  port: ${PORT:8090}
  forward-headers-strategy: framework

# traces
logging:
  level:
    org.springframework: DEBUG
    org.springframework.boot: DEBUG
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG
    org.springframework.cloud.gateway: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} ${LOG_LEVEL_PATTERN:-%5p} %m%n"

---
###### Local/Integration properties ######
spring:
  config:
    activate:
      on-profile: "loc|dev"
    import: "optional:consul:"
  cloud:
    consul:
      enabled: true
      host: ${CONSUL_HOST:localhost}
      port: ${CONSUL_PORT:8500}
      discovery:
        enabled: true
        prefer-ip-address: true
        health-check-path: /actuator/health
        health-check-interval: 15s
        instance-id: ${spring.application.name}:${random.value}
        service-name: ${spring.application.name}
      config:
        enabled: true
        fail-fast: false
        prefixes: 
          - config
        default-context: ${spring.application.name}
        format: YAML
        watch:
          delay: 5000
          wait-time: 30

---
###### Integration properties ######
spring:
  config:
    activate:
      on-profile: "dev"
  security:
    oauth2:
      client:
        provider:
          camila-keycloak:
            issuer-uri: "${KEYCLOAK_URL:http://localhost:9191}/realms/${KEYCLOAK_REALM:camila-realm}"
            token-uri: "${KEYCLOAK_URL:http://localhost:9191}/realms/${KEYCLOAK_REALM:camila-realm}/protocol/openid-connect/token"
            authorization-uri: "${KEYCLOAK_URL:http://localhost:9191}/realms/${KEYCLOAK_REALM:camila-realm}/protocol/openid-connect/auth"
            jwk-set-uri: "${KEYCLOAK_URL:http://localhost:9191}/realms/${KEYCLOAK_REALM:camila-realm}/protocol/openid-connect/certs"
            user-info-uri: "${KEYCLOAK_URL:http://localhost:9191}/realms/${KEYCLOAK_REALM:camila-realm}/protocol/openid-connect/userinfo"
            user-name-attribute: preferred_username
        registration:
          gateway:
            provider: camila-keycloak
            client-id: camila-client
            client-secret: Fuvf8XyBDXxU57NAOOFZVvdUIPmGgiyE
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}"
            scope: profile, openid, email, roles, web-origins, camila/read, camila/write

# Enable all management endpoints
# https://docs.spring.io/spring-boot/reference/actuator/tracing.html#actuator.micrometer-tracing.tracer-implementations
management:
  observations:
    enable:
      all: true
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  # old way to configure Zipkin exporter (deprecated in favor of OpenTelemetry)
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}
      connect-timeout: 10s
      read-timeout: 30s

otel:
  instrumentation:
    common:
      default-enabled: false
    micrometer:
      enabled: true
    spring-webflux:
      enabled: true
  exporter:
    otlp:
      endpoint: "${OTEL_TRACING_ENDPOINT:http://localhost:4317}"
      timeout: 10s

---
###### Test properties ######
spring:
  config:
    activate:
      on-profile: "test"
  cloud:
    consul:
      enabled: false
      discovery:
        enabled: false
      config:
        enabled: false
