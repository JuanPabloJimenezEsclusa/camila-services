# local docker compose services

services:
  ## Databases
  mongodb:
    image: mongodb/mongodb-community-server:8.3.2-ubi9
    container_name: camila-mongo-product-db
    hostname: mongodb
    restart: on-failure:5
    deploy:
      resources:
        limits:
          memory: "3072m"
          cpus: "2"
    env_file:
      - .env
    ports:
      - "27017-27019:27017-27019"
    expose:
      - 27017
      - 27018
      - 27019
    volumes:
      - camila_product_mongodb_data:/data/db
      - ./data/mongodb/:/docker-entrypoint-initdb.d/:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh", "--eval", "db.adminCommand('ping').ok", "--quiet"]
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 25s
    logging:
      driver: fluentd
      options:
        fluentd-address: fluentd:24224
        fluentd-async: "true"
        fluentd-async-reconnect-interval: 10s
        tag: docker.app
    labels:
      org.springframework.boot.readiness-check.tcp.disable: true
    networks:
      camila_product_network:
  couchbase:
    image: couchbase/server:8.0.1
    container_name: camila-couchbase-product-db
    hostname: couchbase
    restart: on-failure:5
    stdin_open: true
    tty: true
    entrypoint: [""]
    command: sh -c "/opt/couchbase/init/init-cbserver.sh"
    deploy:
      resources:
        limits:
          memory: "4096m"
          cpus: "4"
    env_file:
      - .env
    ports:
      - "8091-8096:8091-8096"
      - "11207:11207"
      - "11210:11210"
    expose:
      - 8091
      - 11207
      - 11210
    volumes:
      - camila_product_couchbase_data:/opt/couchbase/var
      - ./data/couchbase/:/opt/couchbase/init:rw
    healthcheck:
      test: ps aux | grep init-cbserver.sh || exit 1
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 5s
    logging:
      driver: fluentd
      options:
        fluentd-address: fluentd:24224
        fluentd-async: "true"
        fluentd-async-reconnect-interval: 10s
        tag: docker.app
    labels:
      org.springframework.boot.readiness-check.tcp.disable: true
    networks:
      camila_product_network:
  redis:
    image: redis:8.6.2-alpine
    container_name: camila-redis-product-db
    hostname: redis
    restart: on-failure:5
    command: redis-server --save 20 1 --loglevel warning --requirepass camila
    deploy:
      resources:
        limits:
          memory: "1024m"
          cpus: "1"
    env_file:
      - .env
    ports:
      - "6379:6379"
    expose:
      - 6379
    volumes:
      - camila_product_redis_data:/data
    healthcheck:
      test: ps aux | grep redis-server || exit 1
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 5s
    logging:
      driver: fluentd
      options:
        fluentd-address: fluentd:24224
        fluentd-async: "true"
        fluentd-async-reconnect-interval: 10s
        tag: docker.app
    networks:
      camila_product_network:
  redisinsight:
    image: redislabs/redisinsight:latest
    container_name: camila-redisinsight
    hostname: redisinsight
    restart: on-failure:1
    deploy:
      resources:
        limits:
          memory: "1024m"
          cpus: "1"
    env_file:
      - .env
    ports:
      - "5540:5540"
    expose:
      - 5540
    logging:
      driver: fluentd
      options:
        fluentd-address: fluentd:24224
        fluentd-async: "true"
        fluentd-async-reconnect-interval: 10s
        tag: docker.app
    networks:
      camila_product_network:

volumes:
  camila_product_mongodb_data:
    name: camila_product_mongodb_data
    driver_opts:
      type: tmpfs
      device: tmpfs
  camila_product_couchbase_data:
    name: camila_product_couchbase_data
    driver_opts:
      type: tmpfs
      device: tmpfs
  camila_product_redis_data:
    name: camila_product_redis_data
    driver_opts:
      type: tmpfs
      device: tmpfs

networks:
  camila_product_network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1
