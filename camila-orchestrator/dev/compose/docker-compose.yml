# dev services

services:
  ## Service Discovery & Configuration (Consul)
  consul:
    image: hashicorp/consul:1.22
    container_name: camila-consul
    hostname: consul
    restart: on-failure:5
    deploy:
      resources:
        limits:
          memory: "512m"
          cpus: "1"
    command: "agent -server -bootstrap-expect=1 -ui -client=0.0.0.0 -bind=0.0.0.0"
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    expose:
      - 8500
      - 8600
    volumes:
      - camila_consul_data:/consul/data
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 5s
    networks:
      camila_product_network:
  consul-init:
    image: hashicorp/consul:1.22
    container_name: camila-consul-init
    restart: "no"
    environment:
      CONSUL_HTTP_ADDR: "http://consul:8500"
    volumes:
      - ./data/consul/consul-kv-init.sh:/consul-kv-init.sh:ro
    command: ["sh", "/consul-kv-init.sh"]
    depends_on:
      consul:
        condition: service_healthy
    networks:
      camila_product_network:
  ## Gateway & Admin
  gateway:
    image: docker.io/library/camila-gateway:1.0.0
    container_name: camila-gateway
    hostname: gateway
    restart: on-failure:5
    deploy:
      resources:
        limits:
          memory: "2048m"
          cpus: "4"
    env_file:
      - .env
    environment:
      - JVM_OPTIONS=
      - JAVA_TOOL_OPTIONS=
      - JAVA_OPTS=-Xms1024m -Xmx1536m -XX:+UseG1GC -XX:+UseContainerSupport
    ports:
      - "5015:5005"
      - "8090:8090"
    expose:
      - 5015
      - 8090
    depends_on:
      consul:
        condition: service_healthy
      consul-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ps aux | grep java || exit 1
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 60s  # gateway needs more time to start for keycloak
    links:
      - consul
      - keycloak
      - redis
    volumes:
      - camila_gateway_tmp:/tmp
    logging:
      driver: fluentd
      options:
        fluentd-address: fluentd:24224
        fluentd-async: "true"
        fluentd-async-reconnect-interval: 10s
        tag: "docker.{{.Name}}"
    networks:
      camila_product_network:
  admin:
    image: docker.io/library/camila-admin:1.0.0
    container_name: camila-admin
    hostname: admin
    restart: on-failure:5
    deploy:
      resources:
        limits:
          memory: "1024m"
          cpus: "1"
    env_file:
      - .env
    ports:
      - "5035:5005"
      - "8100:8100"
    expose:
      - 5035
      - 8100
    depends_on:
      consul:
        condition: service_healthy
      consul-init:
        condition: service_completed_successfully
    volumes:
      - camila_admin_tmp:/tmp
    healthcheck:
      test: ps aux | grep java || exit 1
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 5s
    links:
      - consul
    logging:
      driver: fluentd
      options:
        fluentd-address: fluentd:24224
        fluentd-async: "true"
        fluentd-async-reconnect-interval: 10s
        tag: "docker.{{.Name}}"
    networks:
      camila_product_network:
  ## Databases
  mongodb:
    image: mongodb/mongodb-community-server:8.3.2-ubi9
    container_name: camila-mongo-product-db
    hostname: mongodb
    restart: on-failure:5
    deploy:
      resources:
        limits:
          memory: "3072m"
          cpus: "2"
    env_file:
      - .env
    ports:
      - "27017-27019:27017-27019"
    expose:
      - 27017
      - 27018
      - 27019
    volumes:
      - camila_product_mongodb_data:/data/db
      - ./data/mongodb/:/docker-entrypoint-initdb.d/:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh", "--eval", "db.adminCommand('ping').ok", "--quiet"]
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 25s
    logging:
      driver: fluentd
      options:
        fluentd-address: fluentd:24224
        fluentd-async: "true"
        fluentd-async-reconnect-interval: 10s
        tag: "docker.{{.Name}}"
    networks:
      camila_product_network:
  couchbase:
    image: couchbase/server:8.0.1
    container_name: camila-couchbase-product-db
    hostname: couchbase
    restart: on-failure:5
    stdin_open: true
    tty: true
    entrypoint: [""]
    command: sh -c "/opt/couchbase/init/init-cbserver.sh"
    deploy:
      resources:
        limits:
          memory: "4096m"
          cpus: "4"
    env_file:
      - .env
    ports:
      - "8091-8096:8091-8096"
      - "11207:11207"
      - "11210:11210"
    expose:
      - 8091
      - 11207
      - 11210
    volumes:
      - camila_product_couchbase_data:/opt/couchbase/var
      - ./data/couchbase/:/opt/couchbase/init:rw
    healthcheck:
      test: ps aux | grep init-cbserver.sh || exit 1
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 5s
    logging:
      driver: fluentd
      options:
        fluentd-address: fluentd:24224
        fluentd-async: "true"
        fluentd-async-reconnect-interval: 10s
        tag: "docker.{{.Name}}"
    networks:
      camila_product_network:
  redis:
    image: redis:8.6.3-alpine
    container_name: camila-redis-product-db
    hostname: redis
    restart: on-failure:3
    command: redis-server --save 20 1 --loglevel warning --requirepass camila
    deploy:
      resources:
        limits:
          memory: "1024m"
          cpus: "1"
    env_file:
      - .env
    ports:
      - "6379:6379"
    expose:
      - 6379
    volumes:
      - camila_product_redis_data:/data
    healthcheck:
      test: ps aux | grep redis-server || exit 1
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 5s
    logging:
      driver: fluentd
      options:
        fluentd-address: fluentd:24224
        fluentd-async: "true"
        fluentd-async-reconnect-interval: 10s
        tag: "docker.{{.Name}}"
    networks:
      camila_product_network:
  redisinsight:
    image: redislabs/redisinsight:latest
    container_name: camila-redisinsight
    hostname: redisinsight
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: "1024m"
          cpus: "1"
    env_file:
      - .env
    ports:
      - "5540:5540"
    expose:
      - 5540
    logging:
      driver: fluentd
      options:
        fluentd-address: fluentd:24224
        fluentd-async: "true"
        fluentd-async-reconnect-interval: 10s
        tag: "docker.{{.Name}}"
    networks:
      camila_product_network:
  ## Microservices
  backend-product:
    image: docker.io/library/camila-product-api:1.0.0
    restart: unless-stopped
    hostname: backend-product
    env_file:
      - .env
    deploy:
      mode: replicated
      replicas: 3
      resources:
        limits:
          memory: "1024m"
          cpus: "1"
    ports:
      - "8080-8082:8080"
      - "7000-7002:7000"
      - "6565-6567:6565"
    expose:
      - 8080
      - 7000
      - 6565
    depends_on:
      consul:
        condition: service_healthy
      consul-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_started
      couchbase:
        condition: service_started
    links:
      - consul
      - mongodb
      - couchbase
      - fluentd
      - otel-collector
    volumes:
      - camila_product_backend_tmp:/tmp
    healthcheck:
      test: ps aux | grep java || exit 1
      interval: 5s
      timeout: 2s
      retries: 10
      start_period: 5s
    logging:
      driver: fluentd
      options:
        fluentd-address: fluentd:24224
        fluentd-async: "true"
        fluentd-async-reconnect-interval: 10s
        tag: "docker.{{.Name}}"
    networks:
      camila_product_network:
  ## Security (Authn/Authz)
  keycloak:
    image: quay.io/keycloak/keycloak:26.6
    command: >
      start-dev 
       --hostname keycloak 
       --http-port 9191 
       --import-realm 
       --log-level=WARN 
       --health-enabled=true 
       --metrics-enabled=true
       --tracing-enabled=true 
       --telemetry-endpoint=http://otel-collector:4317
    container_name: keycloak
    hostname: keycloak
    deploy:
      resources:
        limits:
          memory: "2048m"
          cpus: "2"
    restart: on-failure:5
    env_file:
      - .env
    environment:
      JVM_OPTIONS: ""
      JAVA_TOOL_OPTIONS: ""
      JAVA_OPTS: "-Xms1024m -Xmx1700m -XX:MetaspaceSize=96m -XX:MaxMetaspaceSize=256m -XX:+UseG1GC -XX:+UseContainerSupport"
    ports:
      - "9191:9191"
    expose:
      - 9191
    volumes:
      - ./authorization:/opt/keycloak/data/import
      - keycloak_config:/opt/keycloak/config
      - keycloak_data:/opt/keycloak/data
    healthcheck:
      test: [
        'CMD-SHELL',
        '[ -f /tmp/HealthCheck.java ] || echo "public class HealthCheck { public static void main(String[] args) throws java.lang.Throwable { java.net.URI uri = java.net.URI.create(args[0]); System.exit(java.net.HttpURLConnection.HTTP_OK == ((java.net.HttpURLConnection)uri.toURL().openConnection()).getResponseCode() ? 0 : 1); } }" > /tmp/HealthCheck.java && java /tmp/HealthCheck.java http://0.0.0.0:9000/health/live'
      ]
      interval: 30s
      timeout: 5s
      retries: 20
    logging:
      driver: fluentd
      options:
        fluentd-address: fluentd:24224
        fluentd-async: "true"
        fluentd-async-reconnect-interval: 10s
        tag: "docker.{{.Name}}"
    networks:
      camila_product_network:
  ## Monitorization
  prometheus:
    image: prom/prometheus:v3.11.3
    container_name: prometheus
    hostname: prometheus
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: "512m"
          cpus: "1"
    env_file:
      - .env
    ports:
      - "9090:9090"
    expose:
      - 9090
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/alerting:/etc/prometheus/rules
    healthcheck:
      test: ps aux | grep prometheus || exit 1
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 15s
    networks:
      camila_product_network:
  node-exporter:
    image: prom/node-exporter:v1.11.1
    container_name: node-exporter
    hostname: node-exporter
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: "512m"
          cpus: "1"
    env_file:
      - .env
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    links:
      - prometheus
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($|/)'
    ports:
      - "9100:9100"
    networks:
      camila_product_network:
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: cadvisor
    hostname: cadvisor
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: "512m"
          cpus: "1"
    env_file:
      - .env
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8880:8080"
    networks:
      camila_product_network:
  alertmanager:
    image: prom/alertmanager:v0.32.1
    container_name: alertmanager
    hostname: alertmanager
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: "512m"
          cpus: "1"
    env_file:
      - .env
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager
    command:
      - '--config.file=/etc/alertmanager/config.yml'
      - '--storage.path=/alertmanager'
    ports:
      - "9093:9093"
    depends_on:
      mailpit:
        condition: service_healthy
    links:
      - mailpit
    networks:
      camila_product_network:
  grafana:
    image: grafana/grafana:13.0.1
    container_name: grafana
    hostname: grafana
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: "1204m"
          cpus: "1"
    env_file:
      - .env
    ports:
      - "3000:3000"
    expose:
      - 3000
    volumes:
      - ./monitoring/datasources:/etc/grafana/provisioning/datasources
      - ./monitoring/dashboards:/etc/grafana/provisioning/dashboards
      - grafana_data:/var/lib/grafana
    links:
      - prometheus
    healthcheck:
      test: ps aux | grep grafana || exit 1
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 15s
    networks:
      camila_product_network:
  ## Tracing
  zipkin:
    # https://github.com/openzipkin/zipkin#quick-start
    image: openzipkin/zipkin:3.6.1
    container_name: zipkin
    hostname: zipkin
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: "512m"
          cpus: "1"
    env_file:
      - .env
    environment:
      JAVA_TOOL_OPTIONS: ""
    ports:
      - "9411:9411"
    expose:
      - 9411
    networks:
      camila_product_network:
  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    container_name: jaeger
    hostname: jaeger
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: "512m"
          cpus: "1"
    env_file:
      - .env
    ports:
      - "16686:16686"
    expose:
      - 16686
      - 4317
      - 4318
    networks:
      camila_product_network:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.152.0-nightly.286fff0
    container_name: otel-collector
    hostname: otel-collector
    restart: unless-stopped
    command: [ "--config=/etc/otel-collector-config.yaml" ]
    volumes:
      - ./monitoring/otel/otel-config.yml:/etc/otel-collector-config.yaml
    deploy:
      resources:
        limits:
          memory: "256m"
          cpus: "0.5"
    env_file:
      - .env
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - zipkin
      - jaeger
    expose:
      - 4317
      - 4318
    networks:
      camila_product_network:
  ## Observability (EFK)
  elasticsearch:
    image: elasticsearch:9.4.1
    container_name: elasticsearch
    hostname: elasticsearch
    restart: on-failure:1
    deploy:
      resources:
        limits:
          memory: "2048m"
          cpus: "2"
    environment:
      # service failed if it use .env
      - discovery.type=single-node
      - xpack.security.enabled=false
      - cluster.name=elasticsearch
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms1024m -Xmx2000m"
    ports:
      - "9200:9200"
      - "9300:9300"
    expose:
      - 9200
      - 9300
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl","-s" ,"-f", "http://localhost:9200/_cat/health"]
    networks:
      camila_product_network:
  fluentd:
    build:
      context: ./monitoring/fluentd/
      dockerfile: Dockerfile
      args:
        FLUENTD_VERSION: "1.19"
    container_name: fluentd
    hostname: fluentd
    restart: on-failure:1
    deploy:
      resources:
        limits:
          memory: "2048m"
          cpus: "4"
    env_file:
      - .env
    ports:
      - "24224:24224"
      - "24224:24224/udp"
    expose:
      - 24224
    links:
      - elasticsearch
    volumes:
      - ./monitoring/fluentd/fluent.conf:/fluentd/etc/fluent.conf:ro
      - fluentd_logs:/fluentd/log
      - fluentd_buffer:/fluentd/buffer
    depends_on:
      elasticsearch:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      camila_product_network:
  kibana:
    image: kibana:9.4.1
    container_name: kibana
    hostname: kibana
    restart: "no"
    deploy:
      resources:
        limits:
          memory: "2048m"
          cpus: "1"
    env_file:
      - .env
    ports:
      - "5601:5601"
    expose:
      - 5601
    depends_on:
      elasticsearch:
        condition: service_healthy
    links:
      - elasticsearch
    healthcheck:
      test: ["CMD", "curl", "-s", "-f", "http://localhost:5601/login"]
      retries: 5
    networks:
      camila_product_network:
  ## Utilities
  mailpit:
    # https://mailpit.axllent.org/
    image: axllent/mailpit:v1.30.0
    container_name: mailpit
    hostname: mailpit
    restart: on-failure:1
    deploy:
      resources:
        limits:
          memory: "256m"
          cpus: "0.5"
    env_file:
      - .env
    ports:
      - "1025:1025"
      - "8025:8025"
    expose:
      - 1025
      - 8025
    healthcheck:
      test: ps aux | grep mailpit || exit 1
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 5s
    networks:
      camila_product_network:

volumes:
  camila_product_mongodb_data:
    name: camila_product_mongodb_data
    driver_opts:
      type: tmpfs
      device: tmpfs
  camila_product_couchbase_data:
    name: camila_product_couchbase_data
    driver_opts:
      type: tmpfs
      device: tmpfs
  camila_product_redis_data:
    name: camila_product_redis_data
    driver_opts:
      type: tmpfs
      device: tmpfs
  camila_product_backend_tmp:
    name: camila_product_backend_tmp
    driver_opts:
      type: tmpfs
      device: tmpfs
  camila_gateway_tmp:
    name: camila_gateway_tmp
    driver_opts:
      type: tmpfs
      device: tmpfs
  camila_consul_data:
    name: camila_consul_data
    driver_opts:
      type: tmpfs
      device: tmpfs
  camila_admin_tmp:
    name: camila_admin_tmp
    driver_opts:
      type: tmpfs
      device: tmpfs
  keycloak_config:
    name: keycloak_config
    driver_opts:
      type: tmpfs
      device: tmpfs
  keycloak_data:
    name: keycloak_data
    driver_opts:
      type: tmpfs
      device: tmpfs
  grafana_data:
    name: grafana_data
    driver_opts:
      type: tmpfs
      device: tmpfs
  elasticsearch_data:
    name: elasticsearch_data
    driver_opts:
      type: tmpfs
      device: tmpfs
  fluentd_logs:
    name: fluentd_logs
    driver: local
    driver_opts:
      type: none
      o: bind,rw
      device: /tmp/fluentd
  fluentd_buffer:
    name: fluentd_buffer
    driver: local
    driver_opts:
      type: none
      o: bind,rw
      device: /tmp/fluentd
  fluentd_config:
    name: fluentd_config
    driver: local
    driver_opts:
      type: none
      o: bind,rw
      device: /tmp/fluentd

networks:
  camila_product_network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1
