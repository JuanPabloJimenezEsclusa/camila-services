groups:
  - name: gateway_alerts
    rules:
      - alert: Gateway429Spike
        expr: |
          sum by (route) (rate(http_server_requests_seconds_count{status="429"}[1m])) > 1
        for: "2m"
        labels:
          severity: warning
        annotations:
          summary: "Spike of 429 responses on gateway (route={{ $labels.route }})"
          description: >-
            There is a sustained rate of 429 (Too Many Requests) on the gateway route for >2m. 
            Check rate-limiter settings and client behavior.

      - alert: ManyFallbackInvocations
        expr: increase(gateway_fallback_invocations_total[5m]) > 1
        for: "2m"
        labels:
          severity: warning
        annotations:
          summary: "Gateway fallback invoked frequently"
          description: >-
            The gateway fallback endpoint was invoked more than 5 times in the last 5m;
            investigate downstream failures or upstream load.

      - alert: RedisHighLatency
        expr: histogram_quantile(0.95, sum(rate(redis_command_duration_seconds_bucket[5m])) by (le)) > 0.5
        for: "2m"
        labels:
          severity: critical
        annotations:
          summary: "High Redis latency (P95 > 500ms)"
          description: >-
            Redis P95 latency is high; check redis performance, network, and memory.

  - name: instance_alerts
    rules:
      # Alert for any instance that is unreachable for >2 minutes.
      - alert: service_down
        expr: up == 0
        for: "2m"
        labels:
          severity: page
        annotations:
          summary: "Instance {{ $labels.instance }} down"
          description: "{{ $labels.instance }} of job {{ $labels.job }} has been down for more than 2 minutes."

      - alert: high_load
        expr: node_load1 > 0.7
        for: "2m"
        labels:
          severity: page
        annotations:
          summary: "Instance {{ $labels.instance }} under high load"
          description: "{{ $labels.instance }} of job {{ $labels.job }} is under high load."

  - name: container_alerts
    rules:
      - alert: ContainerRestarting
        expr: delta(container_start_time_seconds{name!=""}[15m]) > 0
        for: "5m"
        labels:
          severity: warning
        annotations:
          summary: "Container restarting ({{ $labels.name }})"
          description: "Container {{ $labels.name }} has restarted in the last 15 minutes"

      - alert: ContainerHighMemoryUsage
        expr: (container_memory_usage_bytes{name!=""} / container_spec_memory_limit_bytes{name!=""} * 100) > 80
        for: "5m"
        labels:
          severity: warning
        annotations:
          summary: "Container high memory usage ({{ $labels.name }})"
          description: "Container {{ $labels.name }} memory usage is {{ $value }}%"

      - alert: ContainerCPUThrottling
        expr: rate(container_cpu_cfs_throttled_periods_total{name!=""}[5m]) / rate(container_cpu_cfs_periods_total{name!=""}[5m]) > 0.25
        for: "5m"
        labels:
          severity: warning
        annotations:
          summary: "Container CPU throttling ({{ $labels.name }})"
          description: "Container {{ $labels.name }} is being throttled {{ $value | humanizePercentage }}"
