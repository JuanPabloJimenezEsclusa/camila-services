global:
  scrape_interval: 15s # Scrape targets every 15 seconds
  scrape_timeout: 15s # Timeout after 15 seconds
  evaluation_interval: 30s # Evaluate rules every 30 seconds
  external_labels:
    environment: 'development'
    region: 'local'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
      relabel_configs:
        - source_labels: [__address__]
          target_label: alertmanager_address

rule_files:
  - "/etc/prometheus/rules/*.yml"

# DNS service discovery for better resilience
scrape_configs:
  # Camila Product API replicas (dynamic discovery via docker-compose hostname)
  - job_name: "camila-product-api"
    metrics_path: '/product-dev/api/actuator/prometheus'
    scrape_interval: 10s
    scrape_timeout: 10s
    honor_timestamps: true
    static_configs:
      - targets:
          - 'compose-backend-product-1:8080'
          - 'compose-backend-product-2:8080'
          - 'compose-backend-product-3:8080'
        labels:
          application: 'camila-product-api'
          component: 'core-api'
          group: 'services'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - source_labels: [job]
        target_label: job_name

  # Camila Operations Services (core platform services)
  - job_name: "camila-operations"
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    scrape_timeout: 10s
    honor_timestamps: true
    static_configs:
      - targets:
          - 'discovery:8761'
          - 'gateway:8090'
          - 'admin:8100'
          - 'config:8888'
        labels:
          application: 'camila-operations'
          component: 'platform-services'
          group: 'services'
    relabel_configs:
      - source_labels: [__address__]
        regex: '([^:]+):(\d+)'
        target_label: service
        replacement: '${1}'
      - source_labels: [__address__]
        regex: '[^:]+:(\d+)'
        target_label: port
        replacement: '${1}'

  # Container metrics via cAdvisor
  - job_name: 'cadvisor'
    metrics_path: '/api/v1.0/docker'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          component: 'monitoring'
          collector: 'cadvisor'
          group: 'infrastructure'
    relabel_configs:
      - source_labels: [__address__]
        target_label: container_host

  # Host metrics via Node Exporter
  - job_name: 'node-exporter'
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          component: 'monitoring'
          collector: 'node-exporter'
          group: 'infrastructure'
    relabel_configs:
      - source_labels: [__address__]
        target_label: node_instance

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s
    static_configs:
      - targets: ['localhost:9090']
        labels:
          component: 'monitoring'
          collector: 'prometheus'
          group: 'infrastructure'
