plugins {
  id 'java'
}

description = 'Camila Service Product API'
group = 'com.camila.api'
version = '1.0.0'

// This is an aggregator module - disable all tasks
tasks.withType(AbstractArchiveTask).configureEach {
  enabled = false
}
tasks.withType(Jar).configureEach {
  enabled = false
}
tasks.matching { it.name in ['bootJar', 'bootRun', 'jar', 'assemble', 'bootBuildImage'] }.configureEach {
  enabled = false
}

subprojects {
  if (project.hasProperty('qualityCheck')) {
    apply plugin: 'org.owasp.dependencycheck'

    dependencyCheck {
      skipConfigurations = ['providedRuntime']
      failOnError = false
      formats = ['HTML', 'XML', 'JSON']
      suppressionFile = "${rootDir}/src/main/resources/owasp-suppressions.xml"
      nvd {
        apiKey = System.getenv("NVD_API_KEY") ?: project.findProperty("nvdApiKey")
        delay = 60000
      }
      analyzers {
        ossIndex {
          warnOnlyOnRemoteErrors = true
        }
      }
    }
  }
}
