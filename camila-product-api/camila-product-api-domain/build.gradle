plugins {
  id 'java-library'
}

description = 'Camila Product API - Domain Layer (Pure Business Logic)'
group = 'com.camila.api'
version = '1.0.0'

// Disable Spring Boot tasks for library module
tasks.matching { it.name == 'bootJar' || it.name == 'bootRun' || it.name == 'bootBuildInfo' || it.name == 'bootBuildImage' }.configureEach {
  enabled = false
}

dependencies {
  api 'io.projectreactor:reactor-core'
  api 'com.fasterxml.jackson.core:jackson-annotations'
  api 'org.slf4j:slf4j-api'
  compileOnly 'org.jspecify:jspecify'

  // Testing
  testImplementation 'org.junit.jupiter:junit-jupiter'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
  testImplementation 'io.projectreactor:reactor-test'
  testImplementation 'org.assertj:assertj-core'
  testImplementation 'org.mockito:mockito-core'
  testImplementation 'org.mockito:mockito-junit-jupiter'
}

// Enforce no Spring dependencies in domain
configurations.all {
  resolutionStrategy.eachDependency { DependencyResolveDetails details ->
    if (details.requested.group.startsWith('org.springframework')) {
      throw new GradleException("Domain layer must not depend on Spring Framework! Found: ${details.requested}")
    }
  }
}
