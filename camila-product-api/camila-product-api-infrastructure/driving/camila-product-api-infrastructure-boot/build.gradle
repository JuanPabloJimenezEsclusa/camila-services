plugins {
  id 'java'
  id 'org.springframework.boot'
  id 'io.spring.dependency-management'
  id 'jacoco'
}

description = 'Camila Product API - Spring Boot Application & Integration Tests'

dependencies {
  // Input Adapters
  implementation project(':camila-product-api-infrastructure-rest')
  implementation project(':camila-product-api-infrastructure-graphql')
  implementation project(':camila-product-api-infrastructure-grpc')
  implementation project(':camila-product-api-infrastructure-websocket')
  implementation project(':camila-product-api-infrastructure-rsocket')
  implementation project(':camila-product-api-infrastructure-security')

  // Output Adapters
  implementation project(':camila-product-api-infrastructure-mongo')
  implementation project(':camila-product-api-infrastructure-couchbase')
  implementation project(':camila-product-api-infrastructure-cache')

  // Spring Boot Core
  implementation 'org.springframework.boot:spring-boot-starter-webflux'
  implementation 'org.springframework.boot:spring-boot-starter-actuator'

  // Spring Cloud
  implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
  implementation 'org.springframework.cloud:spring-cloud-starter-config'

  // Observability
  implementation 'io.micrometer:micrometer-tracing-bridge-otel'
  implementation 'io.micrometer:micrometer-registry-prometheus'
  implementation 'io.opentelemetry:opentelemetry-exporter-zipkin'

  // Development Tools
  runtimeOnly 'org.springframework.boot:spring-boot-devtools'
  annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
  implementation 'org.springframework.boot:spring-boot-docker-compose'
  runtimeOnly "de.codecentric:chaos-monkey-spring-boot:${chaosMonkeySpringBoot}"

  // Testing - Core Frameworks
  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testImplementation 'io.projectreactor:reactor-test'
  testImplementation "org.awaitility:awaitility:${awaitility}"

  // Testing - Architecture
  testImplementation "com.tngtech.archunit:archunit-junit5:${archunit}"

  // Testing - Test Data Generation
  testImplementation "org.instancio:instancio-junit:${instancio}"

  // Testing - Behavior (BDD)
  testImplementation "io.cucumber:cucumber-core:${cucumber}"
  testImplementation "io.cucumber:cucumber-java:${cucumber}"
  testImplementation "io.cucumber:cucumber-junit-platform-engine:${cucumber}"
  testImplementation "io.cucumber:cucumber-spring:${cucumber}"
  testImplementation "org.junit.platform:junit-platform-suite:${junitPlatformSuite}"

  // Testing - Benchmarks
  testImplementation "org.openjdk.jmh:jmh-core:${jmh}"
  testImplementation "org.openjdk.jmh:jmh-generator-annprocess:${jmh}"

  // Testing - Testcontainers
  testImplementation 'org.testcontainers:testcontainers'
  testImplementation "org.testcontainers:testcontainers-junit-jupiter:${testcontainersJunit}"
  testImplementation "org.testcontainers:mongodb:${testcontainersMongoDb}"
  testImplementation "org.testcontainers:couchbase:${testcontainersCouchbase}"
  testImplementation "com.redis:testcontainers-redis:${testcontainersRedis}"
  testImplementation 'com.squareup.okhttp3:okhttp-jvm'
}

tasks.named('test') {
  useJUnitPlatform()
}

jacocoTestReport {
  afterEvaluate {
    classDirectories.setFrom(files(classDirectories.files.collect {
      fileTree(dir: it, exclude: [
        '**/input/grpc/**',
        '**/input/rest/api/**',
        '**/input/rest/dto/**',
        '**/input/security/*Config**',
        '**/*MapperImpl**'
      ])
    }))
  }
}

bootJar {
  mainClass = 'com.camila.api.ProductApiApplication'
}

jar {
  enabled = true
}
