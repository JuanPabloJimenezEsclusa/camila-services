###### Default properties ######
spring:
  application:
    name: "@project.name@"
  # https://docs.spring.io/spring-boot/reference/features/spring-application.html#features.spring-application.virtual-threads
  threads:
    virtual:
      enabled: true
  banner:
    # https://www.ascii-art-generator.org/
    location: classpath:/api-banner.txt
  cloud:
    refresh:
      # https://github.com/spring-cloud/spring-cloud-release/wiki/AOT-transformations-and-native-image-support#refresh-scope
      enabled: false
    loadbalancer:
      enabled: false
  couchbase:
    connection-string: couchbase://couchbase:11207
    username: ${COUCHBASE_USERNAME:Administrator}
    password: ${COUCHBASE_PASSWORD:password}
    env:
      ssl:
        enabled: false
      timeouts:
        connect: 30s
  data:
    couchbase:
      bucket-name: camila-product-bucket
      scope-name: product
    mongodb:
      # https://www.mongodb.com/docs/manual/tutorial/connection-pool-performance-tuning/
      uri: "mongodb://${MONGO_USER:camilauser}:${MONGO_PASS:camilauser}@localhost:27017/camila-db?maxPoolSize=200&connectTimeoutMS=120000&timeoutMS=120000&serverSelectionTimeoutMS=90000"
      authentication-database: camila-db
      ssl:
        enabled: false
      auto-index-creation: true
      uuid-representation: JAVA_LEGACY
  docker:
    compose:
      enabled: false
  graphql:
    graphiql:
      enabled: true
      path: /graphiql
  main:
    web-application-type: reactive
  rsocket:
    server:
      mapping-path: /product-dev/api/rsocket
      transport: websocket
  webflux:
    base-path: /product-dev/api
  cache:
    type: caffeine
    cache-names: findByInternalId,sortedProducts
    caffeine:
      spec: initialCapacity=100,maximumSize=10000,expireAfterAccess=60s

info:
  app:
    name: "@project.name@"
    version: "@project.version@"

springdoc:
  api-docs:
    enabled: true
    groups:
      enabled: true
    resolve-schema-properties: true
  enable-spring-security: false
  show-actuator: true
  show-login-endpoint: true
  swagger-ui:
    filter: true
    show-extensions: true
    show-common-extensions: true
    doc-expansion: none
    operations-sorter: method
    persist-authorization: true
    deep-linking: true
    display-request-duration: true
    display-operation-id: true
    defaultModelsExpandDepth: 1
    tagsSorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    env:
      show-values: ALWAYS
      cache:
        time-to-live: 60s
      access: unrestricted
    info:
      cache:
        time-to-live: 3600s
      access: unrestricted
    beans:
      cache:
        time-to-live: 10s
      access: unrestricted
    health:
      show-details: ALWAYS
      show-components: ALWAYS
      access: unrestricted
    configprops:
      show-values: ALWAYS
      access: unrestricted
    shutdown:
      access: unrestricted
    prometheus:
      access: unrestricted
  info:
    env:
      enabled: true
    git:
      enabled: true
      mode: full
    os:
      enabled: true
    process:
      enabled: true
    build:
      enabled: true
    java:
      enabled: true
  tracing:
    enabled: false

logging:
  charset:
    console: UTF-8
  level:
    root: INFO
    com.camila.api.product: DEBUG
    com.camila.api.product.infrastructure.adapter.output.mongo.config.MongoCondition: ERROR
    com.camila.api.product.infrastructure.adapter.output.couchbase.config.CouchbaseCondition: ERROR
    org.springframework: INFO
    org.springframework.web: WARN
    org.springframework.data: WARN
    org.springframework.cache: TRACE
    org.springframework.context: WARN
    org.mongodb: WARN
    com.mongodb: WARN
    com.couchbase: WARN
    io.lettuce: WARN
    org.springframework.boot: INFO
    org.springframework.boot.autoconfigure.logging.ConditionEvaluationReportLoggingListener: INFO
    org.springframework.boot.web.embedded.netty: WARN
    net.devh.boot.grpc.server: WARN
    io.grpc.netty: WARN
    reactor: WARN

server:
  port: ${PORT:8080}
  shutdown: immediate

grpc:
  # this client only is util to testing
  client:
    product-service:
      address: static://localhost:6565
    GLOBAL:
      negotiation-type: plaintext
  server:
    port: 0 # by default random port
    shutdown-grace-period: 0
    health-service-enabled: true
    reflection-service-enabled: true

repository:
  technology: ${REPOSITORY_TECHNOLOGY:mongo}

---
###### Local|Dev properties ######
spring:
  config:
    activate:
      on-profile: "loc|dev"
  jmx:
    enabled: true
  rsocket:
    server:
      port: 7000

grpc:
  server:
    port: 6565

management:
  endpoint:
    chaosmonkey:
      access: unrestricted
    chaosmonkeyjmx:
      access: unrestricted

# https://github.com/codecentric/chaos-monkey-spring-boot/tree/main/chaos-monkey-docs/src/main/asciidoc
chaos:
  monkey:
    enabled: true
    watcher:
      rest-controller: true
      service: true
      repository: true
      component: false
      actuator-health: true
      controller: false
      rest-template: false
      web-client: false
    assaults:
      level: 10
      latency-active: true
      exceptions-active: true
      kill-application-active: true
      memory-active: true
      cpu-active: true

debug: false
logging:
  level:
    root: ERROR
    com.camila.api.product: ERROR
    org.springframework: ERROR
    org.springframework.data: ERROR
    org.springframework.security: ERROR
    org.springframework.security.oauth2: ERROR
    org.springframework.web.reactive.socket: ERROR
    org.springframework.context: ERROR
    org.mongodb: ERROR
    com.mongodb: ERROR
    com.couchbase: ERROR
    org.springframework.boot: ERROR
    org.springframework.boot.web.embedded.netty: ERROR
    net.devh.boot.grpc.server: ERROR
    io.grpc.netty: ERROR
    reactor: ERROR
    org.hibernate.validator: ERROR
    com.netflix.discovery: ERROR

---
###### Disable config|discovery feature by default ######
spring:
  config:
    activate:
      on-profile: "!dev"
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
  security:
    user:
      name: ${BASIC_AUTH_USER:camila}
      password: ${BASIC_AUTH_PASS:camila}

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
    healthcheck:
      enabled: false

---
###### Enable config|discovery feature on remote deploy ######
spring:
  config:
    activate:
      on-profile: "dev"
    import: "optional:configserver:${CONFIG_SERVER_URI:}"
  cloud:
    discovery:
      enabled: true
    config:
      enabled: true
      retry:
        max-attempts: 10
        max-interval: 10000
        initial-interval: 1000
        multiplier: 1.1
      discovery:
        enabled: true
        service-id: "camila-config"
      label: main
      profile: ${SPRING_PROFILES_ACTIVE:dev}
      name: ${spring.application.name}
      allow-override: true
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USER:default}
      password: ${REDIS_PASSWORD:camila}
      timeout: 20000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
  cache:
    type: redis
    cache-names: findByInternalId,sortedProducts
    redis:
      time-to-live: 120s
      cache-null-values: true
      use-key-prefix: true
      key-prefix: camila-product
  # Enable keycloak security
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: "${KEYCLOAK_URL:http://localhost:9191}/realms/${KEYCLOAK_REALM:camila-realm}"

springdoc:
  enable-spring-security: true
  show-oauth2-endpoints: true

# Enable keycloak security
openapi:
  oAuthFlow:
    url: "${GATEWAY_SERVER_URL:http://localhost}:${server.port:8080}"
    tokenUrl: "${KEYCLOAK_URL:http://localhost:9191}/realms/${KEYCLOAK_REALM:camila-realm}/protocol/openid-connect/token"
    authorizationUrl: "${KEYCLOAK_URL:http://localhost:9191}/realms/${KEYCLOAK_REALM:camila-realm}/protocol/openid-connect/auth"
    refreshUrl: "${KEYCLOAK_URL:http://localhost:9191}/realms/${KEYCLOAK_REALM:camila-realm}/protocol/openid-connect/token"

# Enable Eureka client
eureka:
  client:
    enabled: true
    registryFetchIntervalSeconds: 5
    serviceUrl:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
    healthcheck:
      enabled: true
  instance:
    preferIpAddress: true
    instance-id: ${HOSTNAME}:${spring.application.name}:${server.port}:${random.int(0,9)}
    statusPageUrlPath: ${spring.webflux.base-path}/actuator/info
    healthCheckUrlPath: ${spring.webflux.base-path}/actuator/health
    async-client-initialization: true
    nonSecurePortEnabled: true
    non-secure-port: ${server.port}
    metadata-map:
      weight: ${random.int(1,10)}
      startup: ${random.int}
      # https://cloud.spring.io/spring-cloud-static/spring-cloud-netflix/1.3.6.RELEASE/multi/multi__service_discovery_eureka_clients.html#_status_page_and_health_indicator
      management.context-path: ${spring.webflux.base-path}/actuator
    leaseExpirationDurationInSeconds: 30
    leaseRenewalIntervalInSeconds: 15

# Enable all management endpoints
# https://docs.spring.io/spring-boot/reference/actuator/tracing.html#actuator.micrometer-tracing.tracer-implementations
management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}
      connect-timeout: 10s
      read-timeout: 30s

---
###### Integration properties ######
spring:
  config:
    activate:
      on-profile: "int"
  data:
    mongodb:
      uri: "mongodb://${MONGO_USER:camilauser}:${MONGO_PASS:camilauser}@mongo-nodeport-svc.mongodb.svc.cluster.local:27017/camila-db?maxPoolSize=200&connectTimeoutMS=30000&timeoutMS=120000"
      authentication-database: camila-db
  rsocket:
    server:
      mapping-path: /product-int/api/rsocket
      transport: websocket
      port: 7000
  webflux:
    base-path: /product-int/api

grpc:
  server:
    port: 6565

# Disable all management endpoints
management:
  tracing:
    enabled: false

---
###### Production properties ######

# Spring base properties
spring:
  config:
    activate:
      on-profile: "pre|pro"
  devtools:
    add-properties: false
    livereload:
      enabled: false
  main:
    log-startup-info: true
  rsocket:
    server:
      mapping-path: /product/api/rsocket
      port: 7000
  webflux:
    base-path: /product/api

  # Enable AWS Cognito Oauth2 security
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: "${SECURITY_ISSUER_URI}"

# Set GRPC port
grpc:
  server:
    port: 6565

# Disable all management endpoints
management:
  tracing:
    enabled: false

# Turn off global forward headers
server:
  forward-headers-strategy: framework

# Turn off global debug
debug: false

# Enable OpenApi
openapi:
  oAuthFlow:
    url: "${SERVER_URL:http://localhost:8080}"
    tokenUrl: "${SECURITY_DOMAIN_URI}/oauth2/token"
    authorizationUrl: "${SECURITY_DOMAIN_URI}/oauth2/authorize"
    refreshUrl: "${SECURITY_DOMAIN_URI}/oauth2/token"

# Enable logging for all levels
logging:
  # https://docs.spring.io/spring-boot/reference/features/logging.html#features.logging.structured
  structured:
    format:
      # https://www.elastic.co/docs/reference/ecs
      console: ecs
    ecs:
      service:
        name: "${info.app.name}"
        version: "${info.app.version}"
        environment: "${spring.profiles.active}"
  level:
    reactor: ERROR
    org.hibernate.validator: ERROR
    org.springframework: ERROR
    org.springframework.web: ERROR
    org.springframework.data: ERROR
    org.springframework.context: ERROR
    org.mongodb: ERROR
    com.mongodb: ERROR
    com.couchbase: ERROR
    org.springframework.boot: ERROR
    org.springframework.boot.web.embedded.netty: INFO
    net.devh.boot.grpc.server: ERROR
    io.grpc.netty: ERROR

