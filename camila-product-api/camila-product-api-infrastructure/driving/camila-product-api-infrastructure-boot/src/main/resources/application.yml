    username: ${COUCHBASE_USERNAME:Administrator}
    password: ${COUCHBASE_PASSWORD:password}
    env:
      ssl:
        enabled: false
  mongodb:
    uri: "mongodb://${MONGO_USER:camilauser}:${MONGO_PASS:camilauser}@mongodb:27017/camila-db?maxPoolSize=200&connectTimeoutMS=120000&timeoutMS=120000&serverSelectionTimeoutMS=90000"
    auto-index-creation: true
    uuid-representation: JAVA_LEGACY
    ssl:
      enabled: false
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USER:default}
      password: ${REDIS_PASSWORD:camila}
      timeout: 20000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
  cache:
    type: redis
    cache-names: findByInternalId,sortedProducts
    redis:
      time-to-live: 120s
      cache-null-values: true
      use-key-prefix: true
