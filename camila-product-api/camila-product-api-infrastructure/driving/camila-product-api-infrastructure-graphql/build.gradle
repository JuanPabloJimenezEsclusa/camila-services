plugins {
  id 'java'
  id 'org.springframework.boot'
  id 'io.spring.dependency-management'
}

description = 'Camila Product API - GraphQL Input Adapter'

dependencies {
  // Internal Modules
  implementation project(':camila-product-api-domain')
  implementation project(':camila-product-api-application')

  // Spring Boot Core
  implementation 'org.springframework.boot:spring-boot-starter-webflux'
  implementation 'org.springframework.boot:spring-boot-starter-validation'

  // GraphQL
  implementation 'org.springframework.boot:spring-boot-starter-graphql'
  implementation "com.graphql-java:graphql-java:${graphqlJava}"
  implementation "com.graphql-java:graphql-java-extended-scalars:${graphqlJavaExtendedScalars}"

  // Utilities
  compileOnly 'org.jspecify:jspecify'

  // Development Tools
  compileOnly 'org.projectlombok:lombok'
  annotationProcessor 'org.projectlombok:lombok'
  annotationProcessor "org.mapstruct:mapstruct-processor:${mapstruct}"
  implementation "org.mapstruct:mapstruct:${mapstruct}"

  // Testing
  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testImplementation 'io.projectreactor:reactor-test'
  testImplementation 'org.springframework.graphql:spring-graphql-test'
  testImplementation 'org.instancio:instancio-junit'
}
