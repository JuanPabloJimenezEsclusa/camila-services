plugins {
  id 'java'
  id 'org.springframework.boot'
  id 'io.spring.dependency-management'
  id 'org.openapi.generator'
}

description = 'Camila Product API - REST Input Adapter'

dependencies {
  // Internal Modules
  implementation project(':camila-product-api-domain')
  implementation project(':camila-product-api-application')

  // Spring Boot Core
  implementation 'org.springframework.boot:spring-boot-starter-webflux'
  implementation 'org.springframework.boot:spring-boot-starter-validation'

  // API Documentation
  implementation "org.springdoc:springdoc-openapi-starter-webflux-ui:${springdocOpenapi}"
  implementation 'org.apache.commons:commons-lang3'

  // Utilities
  compileOnly 'org.jspecify:jspecify'

  // Development Tools
  compileOnly 'org.projectlombok:lombok'
  annotationProcessor 'org.projectlombok:lombok'
  annotationProcessor "org.mapstruct:mapstruct-processor:${mapstruct}"
  implementation "org.mapstruct:mapstruct:${mapstruct}"

  // Testing
  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testImplementation 'io.projectreactor:reactor-test'
  testImplementation 'com.squareup.okhttp3:okhttp-jvm'
  testImplementation 'org.instancio:instancio-junit'
}

tasks.register('openApiGenerate') {
  dependsOn tasks.named('compileJava')
}
